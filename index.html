  /* ================= PHOTO HIDDEN-DATA DETECTOR ================= */
  function vxAscii(v, start, len){
    let s = '';
    for(let i = 0; i < len && start + i < v.byteLength; i++){
      const c = v.getUint8(start + i);
      if(c === 0) break;
      s += String.fromCharCode(c);
    }
    return s;
  }

  function vxScanMarkers(buf){
    const r = { jpeg:false, exif:false, xmp:false, iptc:false };
    try{
      const v = new DataView(buf);
      if(v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return r;
      r.jpeg = true;
      let off = 2;
      while(off + 4 <= v.byteLength){
        if(v.getUint8(off) !== 0xFF) break;
        const m = v.getUint8(off + 1);
        if(m === 0xFF){ off++; continue; }
        if(m === 0xDA || m === 0xD9) break;
        if(m === 0x01 || (m >= 0xD0 && m <= 0xD7)){ off += 2; continue; }
        const size = v.getUint16(off + 2);
        if(m === 0xE1){
          const head = vxAscii(v, off + 4, 30);
          if(head.indexOf('Exif') === 0) r.exif = true;
          else if(head.indexOf('http://ns.adobe.com/xap') === 0) r.xmp = true;
        } else if(m === 0xED){
          r.iptc = true;
        }
        off += 2 + size;
      }
    }catch(e){}
    return r;
  }

  function vxParseExif(buf){
    const res = { tags:{}, gps:null };
    try{
      const v = new DataView(buf);
      let off = 2;
      while(off + 4 <= v.byteLength){
        if(v.getUint8(off) !== 0xFF) break;
        const m = v.getUint8(off + 1);
        if(m === 0xFF){ off++; continue; }
        if(m === 0xDA || m === 0xD9) break;
        if(m === 0x01 || (m >= 0xD0 && m <= 0xD7)){ off += 2; continue; }
        const size = v.getUint16(off + 2);
        if(m === 0xE1 && vxAscii(v, off + 4, 6).indexOf('Exif') === 0){ vxParseTiff(v, off + 10, res); break; }
        off += 2 + size;
      }
    }catch(e){}
    return res;
  }

  function vxParseTiff(v, base, res){
    const le = v.getUint16(base) === 0x4949;
    const u16 = function(o){ return v.getUint16(o, le); };
    const u32 = function(o){ return v.getUint32(o, le); };
    const TS = { 1:1, 2:1, 3:2, 4:4, 5:8, 7:1, 9:4, 10:8 };
    function readVal(e){
      const type = u16(e + 2), count = u32(e + 4), size = (TS[type] || 1) * count;
      const vo = size <= 4 ? e + 8 : base + u32(e + 8);
      if(count > 512) return null;
      let i;
      if(type === 2){
        let s = '';
        for(i = 0; i < count; i++){ const c = v.getUint8(vo + i); if(c === 0) break; s += String.fromCharCode(c); }
        return s.trim();
      }
      const a = [];
      if(type === 3){ for(i = 0; i < count; i++) a.push(u16(vo + i * 2)); return a; }
      if(type === 4){ for(i = 0; i < count; i++) a.push(u32(vo + i * 4)); return a; }
      if(type === 5){
        for(i = 0; i < count; i++){ const n = u32(vo + i * 8), d = u32(vo + i * 8 + 4); a.push(d ? n / d : 0); }
        return a;
      }
      return null;
    }
    function readIfd(ifdOff, handler){
      const n = u16(ifdOff);
      for(let i = 0; i < n && i < 200; i++){ const e = ifdOff + 2 + i * 12; handler(u16(e), e); }
    }
    let exifPtr = null, gpsPtr = null;
    readIfd(base + u32(base + 4), function(tag, e){
      if(tag === 0x010F) res.tags.make = readVal(e);
      else if(tag === 0x0110) res.tags.model = readVal(e);
      else if(tag === 0x0131) res.tags.software = readVal(e);
      else if(tag === 0x0132) res.tags.modified = readVal(e);
      else if(tag === 0x8769) exifPtr = u32(e + 8);
      else if(tag === 0x8825) gpsPtr = u32(e + 8);
    });
    if(exifPtr !== null){
      readIfd(base + exifPtr, function(tag, e){
        if(tag === 0x9003) res.tags.taken = readVal(e);
        else if(tag === 0xA434) res.tags.lens = readVal(e);
        else if(tag === 0xA431) res.tags.serial = readVal(e);
        else if(tag === 0xA430) res.tags.owner = readVal(e);
      });
    }
    if(gpsPtr !== null){
      const g = {};
      readIfd(base + gpsPtr, function(tag, e){
        if(tag === 0x0001) g.latRef = readVal(e);
        else if(tag === 0x0002) g.lat = readVal(e);
        else if(tag === 0x0003) g.lonRef = readVal(e);
        else if(tag === 0x0004) g.lon = readVal(e);
        else if(tag === 0x0006) g.alt = readVal(e);
      });
      if(g.lat && g.lon && g.lat.length === 3 && g.lon.length === 3){
        let lat = g.lat[0] + g.lat[1] / 60 + g.lat[2] / 3600;
        let lon = g.lon[0] + g.lon[1] / 60 + g.lon[2] / 3600;
        if(g.latRef === 'S') lat = -lat;
        if(g.lonRef === 'W') lon = -lon;
        res.gps = { lat: lat, lon: lon, alt: (g.alt && g.alt.length) ? g.alt[0] : null };
      }
    }
  }

  let vxPhotoUrl = null;
  let vxCleanUrl = null;

  function vxPhotoSelected(input){
    const file = input.files && input.files[0];
    const out = document.getElementById('vx-photo-result');
    if(!file){ return; }
    if(file.type.indexOf('image/') !== 0){ out.innerHTML = '<p class="incident-hint">اختر ملف صورة من فضلك.</p>'; return; }
    if(vxPhotoUrl){ try{ URL.revokeObjectURL(vxPhotoUrl); }catch(e){} }
    if(vxCleanUrl){ try{ URL.revokeObjectURL(vxCleanUrl); }catch(e){} vxCleanUrl = null; }
    vxPhotoUrl = URL.createObjectURL(file);
    const reader = new FileReader();
    reader.onload = function(){ vxShowPhotoReport(reader.result, file); };
    reader.onerror = function(){ out.innerHTML = '<p class="incident-hint">تعذّرت قراءة الصورة.</p>'; };
    reader.readAsArrayBuffer(file);
  }

  function vxShowPhotoReport(buf, file){
    const out = document.getElementById('vx-photo-result');
    const marks = vxScanMarkers(buf);
    const ex = marks.exif ? vxParseExif(buf) : { tags:{}, gps:null };
    const t = ex.tags;
    const rows = [];
    function row(k, v){ if(v !== null && v !== undefined && v !== '') rows.push('<tr><td>' + k + '</td><td>' + vxEsc(v) + '</td></tr>'); }
    if(ex.gps){
      row('📍 الموقع (خط العرض)', ex.gps.lat.toFixed(5));
      row('📍 الموقع (خط الطول)', ex.gps.lon.toFixed(5));
      if(ex.gps.alt !== null) row('⛰️ الارتفاع', Math.round(ex.gps.alt) + ' m');
    }
    row('📱 الشركة المصنعة', t.make);
    row('📱 طراز الجهاز', t.model);
    row('🕒 وقت التصوير', t.taken);
    row('🕒 آخر تعديل', t.modified);
    row('🔍 العدسة', t.lens);
    row('🔢 الرقم التسلسلي للكاميرا', t.serial);
    row('👤 اسم المالك', t.owner);
    row('🧩 البرنامج', t.software);
    if(marks.xmp) rows.push('<tr><td>🧾 بيانات XMP</td><td>موجودة</td></tr>');
    if(marks.iptc) rows.push('<tr><td>🧾 بيانات IPTC</td><td>موجودة</td></tr>');

    let verdict;
    if(ex.gps){
      verdict = '<div class="vx-verdict bad">⚠️ هذه الصورة تكشف <strong>موقع التصوير بدقة</strong>. من يستلمها كما هي قد يعرف أين كنت، أو أين تسكن إن صُوّرت في بيتك.</div>';
    } else if(rows.length){
      verdict = '<div class="vx-verdict mid">🟡 لا يوجد موقع، لكن الصورة تحمل معلومات عن جهازك أو وقت التصوير.</div>';
    } else if(marks.jpeg){
      verdict = '<div class="vx-verdict ok">✅ لم أجد بيانات مخفية في هذه الصورة. ربما نُظّفت سابقًا، أو أن هاتفك لا يضيف الموقع.</div>';
    } else {
      verdict = '<div class="vx-verdict mid">ℹ️ نوع هذه الصورة (' + vxEsc(file.type || 'غير معروف') + ') لا أستطيع قراءة بياناتها هنا. لكن النسخة النظيفة أدناه تخلو من أي بيانات مضمّنة.</div>';
    }

    let html =
      '<div class="vx-photo-grid"><div><img src="' + vxPhotoUrl + '" alt="معاينة الصورة المختارة"></div><div>' + verdict +
      (rows.length ? '<table class="vx-table">' + rows.join('') + '</table>' : '') + '</div></div>' +
      '<div class="vx-clean-box"><button type="button" class="btn btn-primary" onclick="vxCleanPhoto()">🧼 أنشئ نسخة نظيفة</button>' +
      '<div id="vx-clean-out" aria-live="polite"></div></div>' +
      '<div class="incident-note">💡 على آيفون، قد يحذف Safari الموقع تلقائيًا إن عطّلت «الموقع» في خيارات اختيار الصورة. وتطبيقات التواصل الكبرى تحذف عادةً هذه البيانات عند النشر، أما الإرسال كـ«ملف» أو عبر البريد فيُبقيها.</div>';
    out.innerHTML = html;
    awardOnce('vn_awarded_photoexif', 10, 'فحصت البيانات المخفية في صورة');
  }

  function vxCleanPhoto(){
    const box = document.getElementById('vx-clean-out');
    if(!vxPhotoUrl || !box) return;
    box.innerHTML = '<p class="vx-sub">جارٍ التنظيف...</p>';
    const img = new Image();
    img.onload = function(){
      let w = img.naturalWidth, h = img.naturalHeight;
      const MAX = 4096;
      if(Math.max(w, h) > MAX){ const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(function(blob){
        if(!blob){ box.innerHTML = '<p class="vx-sub">تعذّر إنشاء النسخة النظيفة.</p>'; return; }
        if(vxCleanUrl){ try{ URL.revokeObjectURL(vxCleanUrl); }catch(e){} }
        vxCleanUrl = URL.createObjectURL(blob);
        const rd = new FileReader();
        rd.onload = function(){
          const m = vxScanMarkers(rd.result);
          const clean = !m.exif && !m.xmp && !m.iptc;
          box.innerHTML =
            '<div class="vx-verdict ' + (clean ? 'ok' : 'mid') + '" id="vx-clean-verdict">' +
              (clean ? '✅ تأكدت: النسخة الجديدة لا تحتوي أي بيانات مخفية (لا موقع ولا جهاز ولا تاريخ).' : '⚠️ بقيت بعض البيانات في النسخة الجديدة.') + '</div>' +
            '<img src="' + vxCleanUrl + '" alt="النسخة النظيفة">' +
            '<div><a class="btn btn-primary" id="vx-clean-dl" href="' + vxCleanUrl + '" download="clean-photo.jpg">⬇️ تنزيل النسخة النظيفة</a></div>' +
            '<p class="vx-sub" style="margin-top:10px;">على آيفون: إن لم يبدأ التنزيل، اضغط مطولًا على الصورة أعلاه واختر «حفظ في الصور».</p>';
          awardOnce('vn_awarded_photoclean', 10, 'نظّفت صورة من بياناتها');
        };
        rd.readAsArrayBuffer(blob);
      }, 'image/jpeg', 0.92);
    };
    img.onerror = function(){ box.innerHTML = '<p class="vx-sub">تعذّر فتح الصورة لتنظيفها.</p>'; };
    img.src = vxPhotoUrl;
  }

  function vxSafetyStart(){

  function vxSafetyRender(){
    const host = document.getElementById('vx-safety-host');
    if(!host) return;
    if(vxSafety.i >= VX_SAFETY_Q.length){ vxSafetyFinish(); return; }
    const q = VX_SAFETY_Q[vxSafety.i];
    const opts = VX_SAFETY_OPTS.map(function(o){
      return '<button type="button" class="quiz-option" onclick="vxSafetyAnswer(' + o.v + ')">' + o.t + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="quiz-panel"><div class="quiz-progress">سؤال ' + (vxSafety.i + 1) + ' من ' + VX_SAFETY_Q.length + '</div>' +
      '<div class="quiz-question">' + q.q + '</div><div class="quiz-options">' + opts + '</div></div>';
  }

  function vxSafetyAnswer(v){
    vxSafety.ans.push(v);
    vxSafety.i++;
    vxSafetyRender();
  }

  function vxSafetyFinish(){
    const host = document.getElementById('vx-safety-host');
    let got = 0, max = 0;
    VX_SAFETY_Q.forEach(function(q, i){ got += q.w * vxSafety.ans[i]; max += q.w * 2; });
    const pct = Math.round((got / max) * 100);
    let prev = null;
    try{ const p = localStorage.getItem('vn_safety_score'); if(p !== null) prev = parseInt(p, 10); }catch(e){}
    try{ localStorage.setItem('vn_safety_score', String(pct)); }catch(e){}

    let tier;
    if(pct >= 85) tier = '🛡️ حصن منيع';
    else if(pct >= 65) tier = '👍 جيد، وفيه ما يُحسَّن';
    else if(pct >= 40) tier = '⚠️ متوسط، عندك ثغرات واضحة';
    else tier = '🚨 معرّض للخطر، ابدأ اليوم';

    const weak = VX_SAFETY_Q.map(function(q, i){ return { q:q, gap:q.w * (2 - vxSafety.ans[i]) }; })
      .filter(function(x){ return x.gap > 0; })
      .sort(function(a, b){ return b.gap - a.gap; })
      .slice(0, 3);

    let recs = '';
    if(weak.length){
      recs = '<h4 class="vx-h4">ابدأ بهذه الخطوات الثلاث</h4>' + weak.map(function(x){
        const q = x.q;
        let link = '';
        if(q.lesson) link = '<br><a href="#' + q.lesson + '" class="btn btn-ghost" onclick="goToLesson(\'' + q.lesson + '\'); return false;">اقرأ الدرس</a>';
        else if(q.href) link = '<br><a href="' + q.href + '" class="btn btn-ghost">' + q.cta + '</a>';
        return '<div class="vx-rec">' + q.tip + link + '</div>';
      }).join('');
    } else {
      recs = '<p class="vx-sub">ممتاز! عاداتك قوية. حافظ عليها وعلّمها لمن حولك.</p>';
    }
    const cmp = (prev !== null && prev !== pct)
      ? '<p class="vx-sub">نتيجتك السابقة: ' + prev + '% ' + (pct > prev ? '— تحسّنت 👏' : '') + '</p>' : '';

    host.innerHTML =
      '<div class="quiz-panel quiz-result"><div class="quiz-score">' + pct + '%</div>' +
      '<div class="vx-safety-bar"><div style="width:' + pct + '%;"></div></div>' +
      '<p>' + tier + '</p>' + cmp + '</div>' + recs +
      '<div class="quiz-result-actions" style="margin-top:16px;">' +
        '<button type="button" class="btn btn-ghost" onclick="vxSafetyStart()">إعادة الفحص</button>' +
        '<button type="button" class="btn btn-ghost" onclick="vxSafetyShare(' + pct + ')">📤 تحدَّ صديقك</button></div>';
    awardOnce('vn_awarded_safetycheck', 15, 'أكملت فحص أمانك الرقمي');
  }

  function showIncident(type, btn){
    const data = INCIDENT_STEPS[type];
    if(!data) return;

    document.querySelectorAll('.incident-btn').forEach(function(b){ b.classList.remove('active'); });

      return '<li class="inc-step' + (d ? ' done' : '') + '" role="checkbox" tabindex="0" aria-checked="' + (d ? 'true' : 'false') + '" data-i="' + i + '" onclick="incToggle(' + i + ')" onkeydown="incKey(event,' + i + ')">' +
        (st.now ? '<span class="inc-now">الآن</span>' : '') + '<span class="inc-text">' + st.t + '</span></li>';
    }).join('');
    const warnHtml = data.warn
      ? '<div class="inc-warn-wrap"><h4>📣 رسالة جاهزة لتحذير جهات اتصالك</h4>' +

      '<div class="inc-progress"><div class="inc-progress-bar"><div class="inc-progress-fill" id="inc-fill"></div></div><span class="inc-progress-text" id="inc-count"></span></div>' +
      '<ul class="incident-steps">' + stepsHtml + '</ul>' +
      '<div class="inc-done" id="inc-done">✅ أحسنت! أنهيت كل الخطوات. حسابك الآن أكثر أمانًا، وتذكّر أن تراجع إعدادات الاسترجاع بين وقت وآخر.</div>' +
      warnHtml +
      '<div class="incident-note">💡 خطوة أخيرة دائمًا: راجع إعدادات الاسترجاع (البريد الاحتياطي، رقم الهاتف) في هذا الحساب — أغلب حالات إعادة الاختراق تحدث لأن بيانات الاسترجاع نفسها بقيت مخترقة.</div>' +

  function incUpdateUi(type, done){
    const data = INCIDENT_STEPS[type];
    if(!data) return;
    const total = data.steps.length;
    document.querySelectorAll('#incident-host .inc-step').forEach(function(li){
      const i = parseInt(li.getAttribute('data-i'), 10);
      const d = done.indexOf(i) !== -1;
      li.classList.toggle('done', d);
      li.setAttribute('aria-checked', d ? 'true' : 'false');
    });
    const fill = document.getElementById('inc-fill');
    const count = document.getElementById('inc-count');
    const banner = document.getElementById('inc-done');
    if(fill) fill.style.width = Math.round((done.length / total) * 100) + '%';
    if(count) count.textContent = done.length + ' / ' + total + ' خطوات';
    if(banner) banner.classList.toggle('show', done.length >= total);
  }

  function incToggle(i){
    const type = incCurrent;
    const data = type ? INCIDENT_STEPS[type] : null;
    if(!data) return;
    const done = incGetDone(type);
    const pos = done.indexOf(i);
    if(pos === -1) done.push(i); else done.splice(pos, 1);
    incSaveDone(type, done);
    incUpdateUi(type, done);
    if(done.length >= data.steps.length){
      awardOnce('vn_inc_award_' + type, 15, 'أكملت دليل طوارئ');
      checkBadgeConditions();
    }
  }

  function incKey(e, i){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); incToggle(i); }
  }

  function incReset(){
    if(!incCurrent) return;
    incSaveDone(incCurrent, []);
    incUpdateUi(incCurrent, []);
  }

  function incCopyWarn(btn){
    const txt = INCIDENT_WARN_TEXT;
    function ok(){
      if(!btn) return;
      const old = btn.textContent;
      btn.textContent = '✓ تم النسخ — الصقها في محادثاتك';
      setTimeout(function(){ btn.textContent = old; }, 2500);
    }
    function fallback(){
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ ta.setSelectionRange(0, txt.length); }catch(e){}
      try{ if(document.execCommand('copy')) ok(); }catch(e){}
      document.body.removeChild(ta);
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok, fallback);
        return;
      }
    }catch(e){}
    fallback();
  }

  /* ================= WHAT-IF HACKED CALCULATOR ================= */
  function calcWhatIf(){
    const balanceEl = document.getElementById('wi-balance');
    const gaugeFill = document.getElementById('wi-gauge-fill');
    const verdictEl = document.getElementById('wi-verdict');
    const rangeEl = document.getElementById('wi-range');
    if(!balanceEl || !gaugeFill || !verdictEl || !rangeEl) return;

    const balance = parseFloat(balanceEl.value);
    if(!balance || balance <= 0){
      gaugeFill.style.width = '0%';
      gaugeFill.style.background = 'var(--line)';
      verdictEl.textContent = 'أدخل رصيدك التقريبي لتبدأ';
      verdictEl.style.color = 'var(--paper)';
      rangeEl.textContent = '';
      return;
    }

    const reuse = document.getElementById('wi-reuse').checked;
    const no2fa = document.getElementById('wi-no2fa').checked;
    const click = document.getElementById('wi-click').checked;
    const pub = document.getElementById('wi-public').checked;

    let riskFactors = 0;
    if(reuse) riskFactors++;
    if(no2fa) riskFactors++;
    if(click) riskFactors++;
    if(pub) riskFactors++;

    let minPct, maxPct, pct, color, verdict;
    if(riskFactors === 0){ minPct = 0.03; maxPct = 0.10; pct = 22; color = '#c4b5fd'; verdict = 'تعرّض منخفض — عاداتك الحالية تقلّل فرص الاختراق بشكل كبير'; }
    else if(riskFactors === 1){ minPct = 0.10; maxPct = 0.30; pct = 42; color = '#3d8bff'; verdict = 'تعرّض متوسط — هناك ثغرة واحدة تستحق المعالجة'; }
    else if(riskFactors === 2){ minPct = 0.30; maxPct = 0.60; pct = 62; color = '#eab308'; verdict = 'تعرّض مرتفع — عدة عادات تجتمع لتزيد الخطر فعليًا'; }
    else if(riskFactors === 3){ minPct = 0.60; maxPct = 0.90; pct = 82; color = '#f97316'; verdict = 'تعرّض مرتفع جدًا — أغلب أبواب الحماية مفتوحة'; }
    else { minPct = 0.80; maxPct = 1.0; pct = 96; color = '#ef4444'; verdict = 'تعرّض حرج — خسارة شبه كاملة للرصيد واردة بسهولة'; }

    const minLoss = Math.round(balance * minPct).toLocaleString('en-US');
    const maxLoss = Math.round(balance * maxPct).toLocaleString('en-US');

    gaugeFill.style.width = pct + '%';
    gaugeFill.style.background = color;
    verdictEl.textContent = verdict;
    verdictEl.style.color = color;
    rangeEl.textContent = 'نطاق الخسارة التقديري: من ' + minLoss + ' إلى ' + maxLoss + ' (بنفس وحدة الرصيد التي أدخلتها)';
  }

  /* ---------- AMBIENT SPARKLE PARTICLES ---------- */
  let sparkleCtx = null, sparkleParticles = [], sparkleRAF = null, sparkleW = 0, sparkleH = 0;
  function initSparkles(){
    const canvas = document.getElementById('sparkle-canvas');
    if(!canvas || !canvas.getContext) return;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return;
    sparkleCtx = canvas.getContext('2d');
    function resize(){
      sparkleW = canvas.width = window.innerWidth;
      sparkleH = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    const count = window.innerWidth < 640 ? 26 : 46;
    sparkleParticles = [];
    for(let i = 0; i < count; i++){
      sparkleParticles.push({
        x: Math.random() * sparkleW,
        y: Math.random() * sparkleH,
        r: Math.random() * 1.4 + 0.5,
        baseAlpha: Math.random() * 0.5 + 0.25,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.4 + 0.08,
        vy: (Math.random() - 0.5) * 0.08,
        vx: (Math.random() - 0.5) * 0.06,
        hue: Math.random() > 0.5 ? '139,92,246' : '232,121,249'
      });
    }
    let t = 0;
    function tick(){
      if(document.hidden){ sparkleRAF = requestAnimationFrame(tick); return; }
      t += 0.016;
      sparkleCtx.clearRect(0, 0, sparkleW, sparkleH);
      sparkleParticles.forEach(function(p){
        p.x += p.vx; p.y += p.vy;
        if(p.x < -5) p.x = sparkleW + 5; if(p.x > sparkleW + 5) p.x = -5;
        if(p.y < -5) p.y = sparkleH + 5; if(p.y > sparkleH + 5) p.y = -5;
        const alpha = p.baseAlpha * (0.5 + 0.5 * Math.sin(t * p.speed * 3 + p.phase));
        sparkleCtx.beginPath();
        sparkleCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        sparkleCtx.fillStyle = 'rgba(' + p.hue + ',' + alpha.toFixed(3) + ')';
        sparkleCtx.fill();
      });
      sparkleRAF = requestAnimationFrame(tick);
    }
    tick();
  }

  function shareResult(text, opts){
    opts = opts || {};
    const base = window.location.href.split('#')[0].split('?')[0];
    let url = base;
    if(opts.key){
      const params = ['challenge=' + encodeURIComponent(opts.key)];
      if(opts.score != null) params.push('score=' + encodeURIComponent(opts.score));
      if(opts.total != null) params.push('total=' + encodeURIComponent(opts.total));
      url = base + '?' + params.join('&');
    }
    if(navigator.share){
      navigator.share({ text: text, url: url }).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text + '\n' + url).then(function(){
        showVnToast('📋 تم النسخ', 'شارك الرابط مع صديقك');
      }).catch(function(){});
    }
  }

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    const darkIcon = document.getElementById('theme-icon-dark');
    const lightIcon = document.getElementById('theme-icon-light');
    if(darkIcon && lightIcon){
      if(theme === 'light'){ darkIcon.style.display = 'none'; lightIcon.style.display = ''; }
      else { darkIcon.style.display = ''; lightIcon.style.display = 'none'; }
    }
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', theme === 'light' ? '#f3f4f7' : '#08080e');
    try{ localStorage.setItem('vn_theme', theme); }catch(e){}
  }

    const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(current === 'light' ? 'dark' : 'light');
  }

    const scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const pct = docHeight > 0 ? Math.min(100, Math.max(0, (scrollTop / docHeight) * 100)) : 0;
    bar.style.width = pct + '%';

  let ttsUtterance = null;

  function ttsPickArabicVoice(){
    try{
      const voices = window.speechSynthesis.getVoices();
      return voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf('ar') === 0; }) || null;
    }catch(e){ return null; }
  }

  function ttsResetBtn(){
    if(ttsActiveBtn){
      ttsActiveBtn.classList.remove('listening');
      ttsActiveBtn.textContent = '\ud83d\udd0a \u0627\u0633\u062a\u0645\u0639 \u0644\u0647\u0630\u0627 \u0627\u0644\u062f\u0631\u0633';
    }
    ttsActiveBtn = null;
    ttsUtterance = null;
  }

  function ttsGetLessonText(block){
    const body = block.querySelector('.lesson-body');
    if(!body) return '';
    const parts = [];
    body.querySelectorAll('p, .callout, li').forEach(function(el){
      const t = el.textContent.trim();
      if(t) parts.push(t);
    });
    return parts.join('. ');
  }

  function toggleListen(btn){
    if(!('speechSynthesis' in window)){
      alert('\u0647\u0630\u0627 \u0627\u0644\u0645\u062a\u0635\u0641\u062d \u0644\u0627 \u064a\u062f\u0639\u0645 \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u0635\u0648\u062a\u064a\u0629.');
      return;
    }
    const block = btn.closest('.lesson-block');
    if(!block) return;

    if(ttsActiveBtn === btn && window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      ttsResetBtn();
      return;
    }

    window.speechSynthesis.cancel();
    ttsResetBtn();

    const text = ttsGetLessonText(block);
    if(!text) return;

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ar-SA';
    const voice = ttsPickArabicVoice();
    if(voice) utter.voice = voice;
    utter.rate = 0.98;
    utter.onend = ttsResetBtn;
    utter.onerror = ttsResetBtn;

    ttsUtterance = utter;
    ttsActiveBtn = btn;
    btn.classList.add('listening');
    btn.textContent = '\u23f8 \u0625\u064a\u0642\u0627\u0641 \u0627\u0644\u0642\u0631\u0627\u0621\u0629';

    window.speechSynthesis.speak(utter);
  }

  function escapeHtml(str){

  function renderDockSearchResults(query){
    const host = document.getElementById('dock-search-results');
    if(!host) return;
    const q = query.trim().toLowerCase();
    let matches;
    if(!q){
      matches = SEARCH_INDEX.slice(0, 8);
    } else {
      matches = SEARCH_INDEX.filter(function(item){
        return item.label.toLowerCase().includes(q);
      }).slice(0, 14);
    }
    if(matches.length === 0){
      host.innerHTML = '<div class="dock-search-empty">لا نتائج مطابقة</div>';
      return;
    }
    host.innerHTML = matches.map(function(item){
      return '<button type="button" class="dock-search-item" onclick="goToSearchResult(\'' + item.targetId + '\',\'' + item.type + '\')"><span class="dock-search-tag">' + item.tag + '</span>' + escapeHtml(item.label) + '</button>';

  }

  /* ---------- INTRO ANIMATION: matrix rain + terminal boot sequence ---------- */
  const INTRO_BOOT_LINES = [
    'جارِ التحقق من الهوية...',
    'تشفير الاتصال... [OK]',
    'تحميل وحدات الحماية...',
    'فحص التهديدات المحيطة... لا يوجد خطر',

  let matrixAnimId = null;
  let matrixResizeHandler = null;
  let introTimers = [];

  function startMatrixRain(){
    const canvas = document.getElementById('matrix-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    function resize(){
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resize();
    matrixResizeHandler = resize;
    window.addEventListener('resize', matrixResizeHandler);
    const fontSize = 16;
    const chars = '01ABCDEF#$%&*!?@<>/\\';
    const colors = ['#9a52ff', '#c4b5fd', '#3d8bff', '#8ec2ff'];
    let drops = new Array(Math.max(1, Math.floor(canvas.width / fontSize))).fill(1);
    function draw(){
      if(drops.length !== Math.max(1, Math.floor(canvas.width / fontSize))){
        drops = new Array(Math.max(1, Math.floor(canvas.width / fontSize))).fill(1);
      }
      ctx.fillStyle = 'rgba(5,5,10,0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontSize + 'px monospace';
      for(let i = 0; i < drops.length; i++){
        const ch = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
        if(drops[i] * fontSize > canvas.height && Math.random() > 0.975){ drops[i] = 0; }
        drops[i]++;
      }
      matrixAnimId = requestAnimationFrame(draw);
    }
    draw();
  }

  function stopMatrixRain(){
    if(matrixAnimId){ cancelAnimationFrame(matrixAnimId); matrixAnimId = null; }
    if(matrixResizeHandler){ window.removeEventListener('resize', matrixResizeHandler); matrixResizeHandler = null; }
  }

  function runBootSequence(){
    const host = document.getElementById('intro-boot-lines');
    if(!host) return;
    host.innerHTML = '';
    let lineIndex = 0;
    function typeLine(){
      if(lineIndex >= INTRO_BOOT_LINES.length){
        introTimers.push(setTimeout(finishIntroAnimation, 700));
        return;
      }
      const lineEl = document.createElement('div');
      lineEl.className = 'intro-boot-line';
      host.appendChild(lineEl);
      const text = '> ' + INTRO_BOOT_LINES[lineIndex];
      let charIndex = 0;
      function typeChar(){
        if(charIndex <= text.length){
          lineEl.textContent = text.slice(0, charIndex);
          charIndex++;
          introTimers.push(setTimeout(typeChar, 22));
        } else {
          lineIndex++;
          introTimers.push(setTimeout(typeLine, 380));
        }
      }
      typeChar();
    }
    typeLine();
  }

  function showIntroAnimation(){
    const screen = document.getElementById('intro-anim-screen');
    if(!screen) return;
    screen.style.display = 'flex';
    screen.classList.remove('fade-out');

  /* ---------- LEARNING TRACKS (beginner/intermediate/advanced) ---------- */
  function trackFilter(scope, level){
    const container = document.getElementById(scope);
    if(!container) return;
    const blocks = container.querySelectorAll('.lesson-block');
    blocks.forEach(function(b){
      const lvl = b.getAttribute('data-level');
      b.style.display = (level === 'all' || lvl === level) ? '' : 'none';
    });
    const tabsWrap = container.querySelector('.track-tabs[data-scope="' + scope + '"]');
    if(tabsWrap){
      tabsWrap.querySelectorAll('.track-tab').forEach(function(t){
        const onclickAttr = t.getAttribute('onclick') || '';
        t.classList.toggle('active', onclickAttr.indexOf("'" + level + "'") !== -1);
      });
    }
    try{ localStorage.setItem('vn_track_filter_' + scope, level); }catch(e){}
  }

  function renderTrackCounts(scope){
    const container = document.getElementById(scope);
    if(!container) return;
    const blocks = Array.from(container.querySelectorAll('.lesson-block'));
    const totals = { all: blocks.length, beginner: 0, intermediate: 0, advanced: 0 };
    const done = { all: 0, beginner: 0, intermediate: 0, advanced: 0 };
    blocks.forEach(function(b){
      const lvl = b.getAttribute('data-level') || 'beginner';
      totals[lvl] = (totals[lvl] || 0) + 1;
      let isDone = false;
      try{ isDone = localStorage.getItem('vn_quiz_' + b.id) !== null; }catch(e){}
      if(isDone){ done.all++; done[lvl] = (done[lvl] || 0) + 1; }
    });
    ['all', 'beginner', 'intermediate', 'advanced'].forEach(function(lvl){
      const el = document.getElementById('track-count-' + scope + '-' + lvl);
      if(el) el.textContent = (done[lvl] || 0) + '/' + (totals[lvl] || 0);
    });
  }

      return;

    let matchKey = null;
    Object.keys(SHELL_SECTIONS).forEach(function(k){
      if(matchKey) return;
      if(k.indexOf(arg) !== -1 || SHELL_SECTIONS[k].indexOf(arg) !== -1) matchKey = k;
    });
    if(!matchKey){
      shellPrint('القسم غير موجود: ' + arg + ' — اكتب ls لعرض كل الأقسام', 'shell-err');
      return;
    }
    const el = document.getElementById(matchKey);
    if(el){
      shellPrint('جارِ الانتقال إلى: ' + SHELL_SECTIONS[matchKey] + ' ...', 'shell-ok');
      setTimeout(function(){ el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 300);
    } else {
      shellPrint('تعذّر العثور على هذا القسم في الصفحة.', 'shell-err');
    }
  }

  function shellRunCommand(raw){
    const cmd = raw.trim();
    if(!cmd) return;
    shellPrint('&gt; ' + cmd.replace(/</g,'&lt;'), 'shell-cmd-echo');
    shellHistory.push(cmd);
    shellHistoryIndex = shellHistory.length;

    const parts = cmd.split(/\s+/);
    const base = parts[0].toLowerCase();
    const arg = parts.slice(1).join(' ').toLowerCase();

    switch(base){
      case 'help':
        shellPrint([
          'الأوامر المتاحة:',
          '&nbsp;&nbsp;help &nbsp;&nbsp;— عرض هذه القائمة',
          '&nbsp;&nbsp;whoami — من أنت هنا؟',
          '&nbsp;&nbsp;status — حالة الحماية الحالية',
          '&nbsp;&nbsp;scan &nbsp;&nbsp;— فحص سريع لإحصائيات الموقع',
          '&nbsp;&nbsp;ls / sections — عرض كل الأقسام المتاحة',
          '&nbsp;&nbsp;open [اسم القسم] — الانتقال مباشرة لقسم',
          '&nbsp;&nbsp;clear — تفريغ الشاشة'
        ].join('\n'));
        break;

      case 'whoami':
        shellPrint('visitor@cyberdz — زائر فضولي يهتم بحماية نفسه رقميًا 🛡️', 'shell-ok');
        break;

      case 'status':
        shellPrint([
          '[OK] الاتصال الحالي مشفّر (HTTPS)',
          '[OK] عدد الدروس المتاحة الآن: ' + document.querySelectorAll('.lesson-block').length,
          '[OK] عدد الأقسام التفاعلية: ' + Object.keys(SHELL_SECTIONS).length,
          '[READY] النظام جاهز لاستقبال أوامرك.'
        ].join('\n'), 'shell-ok');
        break;

      case 'scan':
        shellScan();
        break;

      case 'ls':
      case 'sections':
        shellPrint(Object.keys(SHELL_SECTIONS).map(function(k){ return k + ' — ' + SHELL_SECTIONS[k]; }).join('\n'), 'shell-muted');
        shellPrint('اكتب: open [اسم] للانتقال، مثال: open lessons', 'shell-muted');
        break;

      case 'clear':
      case 'cls':
        document.getElementById('shell-output').innerHTML = '';
        break;

      case 'open':
      case 'go':
      case 'cd':
        shellOpenSection(arg);
        break;

      case 'date':
        shellPrint(new Date().toLocaleString('ar'), 'shell-muted');
        break;

      case 'sudo':
        shellPrint('Nice try. الصلاحيات هنا محدودة بالفضول فقط 😄', 'shell-err');
        break;

      case 'matrix':
        shellPrint('Wake up, Neo... 🟢', 'shell-ok');
        break;

      case 'hack':
        shellPrint('هذا الموقع يعلّمك كيف تحمي نفسك، لا كيف تخترق غيرك. اكتب help بدل ذلك.', 'shell-err');
        break;

      default:
        shellPrint('command not found: ' + cmd.replace(/</g,'&lt;') + ' — اكتب help للمساعدة', 'shell-err');
    }
  }

  function initShell(){
    const input = document.getElementById('shell-input');
    const out = document.getElementById('shell-output');
    if(!input || !out || out.dataset.started) return;
    out.dataset.started = '1';
    shellGreet();
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        const val = input.value;
        input.value = '';
        shellRunCommand(val);
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        if(shellHistory.length){
          shellHistoryIndex = Math.max(0, shellHistoryIndex - 1);
          input.value = shellHistory[shellHistoryIndex] || '';
        }
      } else if(e.key === 'ArrowDown'){
        e.preventDefault();
        if(shellHistory.length){
          shellHistoryIndex = Math.min(shellHistory.length, shellHistoryIndex + 1);
          input.value = shellHistory[shellHistoryIndex] || '';
        }
      }
    });
  }

  function startTerminal(){
    const body = document.getElementById('term-body');
    if(!body || body.dataset.started) return;
    body.dataset.started = '1';
    const lines = [
      '$ initializing security monitor...',
      '[OK] 2FA verification passed for active session',
      '[BLOCKED] phishing link flagged in incoming email',
      '[OK] system update installed — 3 vulnerabilities patched',
      '[BLOCKED] login attempt from unrecognized device',
      '[OK] backup completed — 4.2GB encrypted and stored',
      '[BLOCKED] connection attempt from flagged IP range',
      '[OK] all five layers active — status: protected'
    ];
    let lineIndex = 0, charIndex = 0, shown = [];
    body.innerHTML = '<span class="caret"></span>';

    function typeChar(){
      if(lineIndex >= lines.length){
        setTimeout(function(){ shown = []; lineIndex = 0; charIndex = 0; typeChar(); }, 2200);
        return;
      }
      const current = lines[lineIndex];
      charIndex++;
      const partial = shown.concat([current.slice(0, charIndex)]);
      body.innerHTML = partial.join('\n') + '<span class="caret"></span>';
      if(charIndex < current.length){
        setTimeout(typeChar, 22);
      } else {
        shown.push(current);
        if(shown.length > 6) shown.shift();
        lineIndex++;
        charIndex = 0;
        setTimeout(typeChar, 550);
      }
    }
    typeChar();
  }
