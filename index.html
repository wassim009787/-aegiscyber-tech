<style>
  :root{
    --ink:#08080e;
    --ink-fixed:#08080e;
    --panel:#12141c;
    --panel-2:#171a24;
    --line:#262a3b;
    --brass:#9a52ff;
    --brass-bright:#c4b5fd;
    --brass-dim:#4c1d95;
    --rust:#3d8bff;
    --rust-bright:#8ec2ff;
    --paper:#eef1f6;
    --text:#d9dce3;
    --muted:#79828f;
    --nav-bg:rgba(10,10,20,0.88);
    --glass-bg:rgba(255,255,255,0.045);
    --glass-bg-2:rgba(255,255,255,0.065);
    --glass-border:rgba(255,255,255,0.12);
    --glass-shadow:0 8px 28px rgba(0,0,0,0.32);
    --mono:'IBM Plex Mono', monospace;
    --head:'Cairo', sans-serif;
    --body:'Tajawal', sans-serif;
    transition:background-color .25s;
  }
  :root[data-theme="light"]{
    --ink:#f3f4f7;
    --panel:#ffffff;
    --panel-2:#edeff3;
    --line:#d8dbe2;
    --brass:#7c3aed;
    --brass-bright:#6d28d9;
    --rust:#1d4fd8;
    --rust-bright:#1e40af;
    --paper:#151821;
    --text:#2b2f38;
    --muted:#5b6170;
    --nav-bg:rgba(255,255,255,0.78);
    --glass-bg:rgba(255,255,255,0.55);
    --glass-bg-2:rgba(255,255,255,0.68);
    --glass-border:rgba(20,24,33,0.10);
    --glass-shadow:0 4px 22px rgba(20,24,33,0.08);
  }
  :root[data-theme="light"] body{ background:var(--ink); }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--body);
    line-height:1.8;
    overflow-x:hidden;
  }
  a{color:inherit;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--nav-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--glass-border);
    border-radius:0 0 18px 18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.16);
    transition:box-shadow .3s ease;
  }
  nav{display:flex; align-items:center; justify-content:space-between; padding:18px 28px; max-width:1120px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:11px; direction:ltr;}
  .brand .mark{width:34px; height:34px; flex-shrink:0;}
  .brand-name{ font-family:'Orbitron',var(--head); font-weight:800; font-size:20px; letter-spacing:.5px; display:inline-flex; }
  .brand-name .bn-1{
    background:linear-gradient(90deg,#6d28d9,#b36bff);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:#9b5cf6;
    filter:drop-shadow(0 0 6px rgba(154,82,255,.55));
  }
  .brand-name .bn-2{ color:#fff; text-shadow:0 0 10px rgba(96,165,250,.75); }
  :root[data-theme="light"] .brand-name .bn-2{ color:#1d4fd8; text-shadow:none; }
  :root[data-theme="light"] .brand .mark .mark-c{ stroke:#1e1b4b; }
  .navlinks{display:flex; gap:32px; font-size:15px; color:var(--muted);}
  .navlinks a{transition:color .2s;}
  .navlinks a:hover{color:var(--brass);}
  @media (max-width:760px){ .navlinks{display:none;} }
  .theme-toggle-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--brass);
    transition:transform .2s, background .2s; flex-shrink:0; margin-inline-start:18px;
  }
  .theme-toggle-btn:hover{ transform:scale(1.08); background:var(--panel-2); }
  @media (max-width:760px){ .theme-toggle-btn{ margin-inline-start:auto; } }
  #reading-progress{
    position:fixed; top:0; inset-inline-start:0; height:3px; width:0%; z-index:200;
    background:linear-gradient(90deg, var(--brass), var(--rust-bright));
    transition:width .08s linear; pointer-events:none;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:90px 0 70px;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero .wrap{display:grid; grid-template-columns:1.1fr 0.9fr; gap:56px; align-items:center; position:relative; z-index:1;}
  @media (max-width:860px){ .hero .wrap{grid-template-columns:1fr;} }
  .hero-watermark{position:absolute; inset:0; z-index:0; opacity:.09; pointer-events:none;}
  .hero-watermark svg{width:100%; height:100%;}
  .eye-label{font-family:var(--mono); font-size:9px; fill:#c4b5fd;}
  .eye-scan{animation:eyeScan 4.5s ease-in-out infinite;}
  @keyframes eyeScan{
    0%,100%{ transform:translateY(0); opacity:.3; }
    50%{ transform:translateY(160px); opacity:1; }
  }
  .kicker{
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--mono); font-size:12.5px; color:var(--brass);
    border:1px solid var(--brass-dim); padding:6px 14px; border-radius:2px;
    margin-bottom:22px;
  }
  .kicker::before{content:''; width:6px; height:6px; background:var(--brass); display:inline-block;}
  h1{
    font-family:var(--head); font-weight:900; font-size:clamp(34px,4.6vw,54px);
    line-height:1.25; margin-bottom:22px; color:var(--paper);
  }
  .hero p.lead{font-size:18px; color:var(--muted); max-width:52ch; margin-bottom:34px;}
  .cta-row{display:flex; gap:16px; flex-wrap:wrap;}
  .btn{
    font-family:var(--body); font-weight:700; font-size:15px;
    padding:14px 28px; border-radius:2px; cursor:pointer; border:1px solid transparent;
    transition:transform .15s, background .2s;
  }
  .btn-primary{background:var(--brass); color:var(--ink-fixed); transition:transform .15s, background .2s, border-radius .4s ease;}
  .btn-primary:hover{transform:translateY(-2px); background:var(--brass-bright); box-shadow:0 0 24px rgba(154,82,255,0.35); border-radius:14px 4px 14px 4px;}
  .btn-ghost{border-color:var(--line); color:var(--text);}
  .btn-ghost:hover{border-color:var(--brass);}

  /* layered defense diagram (hero visual) */
  .rings{position:relative; width:100%; aspect-ratio:1/1; max-width:420px; margin:0 auto;}
  .rings svg{width:100%; height:100%;}
  .ring-label{font-family:var(--mono); font-size:10.5px; fill:var(--muted);}

  /* ---------- SECTION generic ---------- */
  section{padding:80px 0;}
  .section-head{max-width:640px; margin-bottom:56px;}
  .eyebrow{font-family:var(--mono); font-size:12.5px; color:var(--brass); margin-bottom:14px; display:block;}
  h2{font-family:var(--head); font-weight:700; font-size:clamp(26px,3.2vw,36px); color:var(--paper); margin-bottom:16px;}
  .section-head p{color:var(--muted); font-size:16.5px; max-width:60ch;}

  /* ---------- STATS ---------- */
  .stats-band{background:var(--panel); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .stats-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:0;}
  @media (max-width:760px){ .stats-grid{grid-template-columns:1fr;} }
  .stat{
    padding:44px 30px; text-align:center; border-inline-start:1px solid var(--line);
  }
  .stat:first-child{border-inline-start:none;}
  @media (max-width:760px){ .stat{border-inline-start:none; border-top:1px solid var(--line);} .stat:first-child{border-top:none;} }
  .stat .num{font-family:var(--mono); font-size:38px; color:var(--brass); font-weight:500;}
  .stat .cap{font-size:14.5px; color:var(--muted); margin-top:10px;}

  /* ---------- DEFENSE LAYERS ---------- */
  .layers{display:flex; flex-direction:column; gap:0; border:1px solid var(--line);}
  .layer{
    display:grid; grid-template-columns:64px 1fr 1fr; gap:24px;
    padding:30px 28px; border-bottom:1px solid var(--line); align-items:start;
    position:relative;
  }
  .layer:last-child{border-bottom:none;}
  @media (max-width:760px){ .layer{grid-template-columns:44px 1fr; } .layer .layer-desc{grid-column:2/3;} }
  .layer .idx{font-family:var(--mono); color:var(--brass-dim); font-size:14px; padding-top:4px;}
  .layer h3{font-family:var(--head); font-size:19px; color:var(--paper); margin-bottom:8px;}
  .layer .layer-desc p{color:var(--muted); font-size:15px;}
  .layer:hover{background:rgba(198,154,95,0.04);}

  /* ---------- THREATS grid ---------- */
  .threats{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line);}
  @media (max-width:760px){ .threats{grid-template-columns:1fr;} }

  /* ---------- RESOURCES (external courses) ---------- */
  .resources-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:8px;}
  @media (max-width:760px){ .resources-grid{grid-template-columns:1fr;} }
  .resource-card{
    background:var(--ink); padding:28px 24px; display:flex; flex-direction:column; gap:10px;
    text-decoration:none; transition:background .2s, transform .2s;
  }
  .resource-card:hover{ transform:translateY(-2px); }
  .resource-icon{width:34px; height:34px;}
  .resource-tag{font-family:var(--mono); font-size:11.5px; color:var(--rust); border:1px solid var(--rust); display:inline-block; padding:3px 9px; width:fit-content;}
  .resource-card h3{font-family:var(--head); font-size:16.5px; color:var(--paper); line-height:1.4;}
  .resource-card p{color:var(--muted); font-size:13.5px; line-height:1.75; flex-grow:1;}
  .resource-link{color:var(--brass); font-weight:700; font-size:13.5px;}
  .threat{background:var(--ink); padding:32px 26px;}
  .threat .tag{font-family:var(--mono); font-size:11.5px; color:var(--rust); border:1px solid var(--rust); display:inline-block; padding:3px 9px; margin-bottom:16px;}
  .threat-icon{width:42px; height:42px; margin-bottom:18px; display:block;}

  /* ---------- LESSONS ---------- */
  .lessons-list{ display:flex; flex-direction:column; gap:14px; }
  .lesson-block{
    border:1px solid var(--line); background:var(--panel);
  }
  .lesson-block summary{
    list-style:none; cursor:pointer; padding:22px 24px;
    display:flex; align-items:center; gap:16px;
  }
  .lesson-block summary::-webkit-details-marker{ display:none; }
  .lesson-num{ font-family:var(--mono); font-size:13px; color:var(--brass); flex-shrink:0; }
  .lesson-icon{ flex-shrink:0; display:flex; }
  .lesson-title{ font-family:var(--head); font-weight:700; font-size:16.5px; color:var(--paper); flex:1; }
  .lesson-toggle{
    font-family:var(--mono); font-size:20px; color:var(--muted); flex-shrink:0;
    transition:transform .2s;
  }
  .lesson-block[open] .lesson-toggle{ transform:rotate(45deg); color:var(--brass); }
  .lesson-body{ padding:0 24px 26px; }
  .lesson-body p{ color:var(--muted); font-size:15px; margin-bottom:14px; }
  .lesson-body ul{ padding-inline-start:20px; }
  .lesson-body li{ color:var(--text); font-size:14.5px; margin-bottom:10px; line-height:1.7; }
  .lesson-body li::marker{ color:var(--brass); }
  .lesson-body strong{ color:var(--paper); }
  .lesson-next{ margin-top:4px; }
  .threat h3{font-family:var(--head); font-size:18px; color:var(--paper); margin-bottom:10px;}
  .threat p{color:var(--muted); font-size:14.5px;}

  /* ---------- CHECKLIST ---------- */
  .checklist-wrap{background:var(--panel-2); border:1px solid var(--line); padding:10px 0;}
  .check-item{
    display:flex; align-items:flex-start; gap:18px; padding:22px 32px;
    border-bottom:1px solid var(--line);
  }
  .check-item:last-child{border-bottom:none;}
  .check-item .box{
    width:20px; height:20px; border:1.5px solid var(--brass); flex-shrink:0; margin-top:3px;
    position:relative;
  }
  .check-item .box::after{
    content:''; position:absolute; inset:3px; background:var(--brass); opacity:.85;
  }
  .check-item h4{font-family:var(--body); font-weight:700; font-size:16px; color:var(--text); margin-bottom:4px;}
  .check-item p{color:var(--muted); font-size:14.5px;}

  /* ---------- CTA FOOTER ---------- */
  .cta-final{
    text-align:center; padding:100px 0; border-top:1px solid var(--line);
    background:radial-gradient(ellipse at 50% 0%, rgba(198,154,95,0.07), transparent 60%);
  }
  .cta-final h2{max-width:20ch; margin:0 auto 20px;}
  .cta-final p{color:var(--muted); max-width:50ch; margin:0 auto 36px; font-size:16.5px;}

  footer{border-top:1px solid var(--line); padding:36px 0; font-size:13.5px; color:var(--muted);}

  /* ---------- ABOUT ---------- */
  .about-card{ display:flex; align-items:center; gap:26px; padding:50px 0; }
  @media (max-width:600px){ .about-card{ flex-direction:column; text-align:center; } }
  .about-avatar{
    width:64px; height:64px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--brass), var(--rust));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--head); font-weight:800; font-size:24px; color:var(--ink-fixed);
  }
  .about-text h3{ font-family:var(--head); font-size:17px; color:var(--paper); margin-bottom:8px; }
  .about-text p{ color:var(--muted); font-size:14.5px; max-width:56ch; margin-bottom:10px; }
  .about-link{ font-family:var(--mono); font-size:12.5px; color:var(--brass); text-decoration:none; }
  .about-link:hover{ color:var(--brass-bright); }
  .about-contacts{ display:flex; flex-wrap:wrap; gap:16px; margin-top:6px; }
  .about-contacts .about-link{ display:flex; align-items:center; gap:6px; }

  /* ---------- SOCIAL (skewed 3D cards) ---------- */
  .skew-social{ display:flex; flex-wrap:wrap; justify-content:center; gap:34px 46px; list-style:none; padding:20px 0 10px; }
  .skew-social li a{
    position:relative; display:flex; flex-direction:column; justify-content:center;
    width:150px; height:64px; padding-inline-start:18px;
    background:var(--panel); text-decoration:none;
    transform:rotate(-18deg) skew(14deg);
    transition:.35s;
    box-shadow:-10px 10px 0 rgba(0,0,0,0.35);
  }
  .skew-social li a::before{
    content:''; position:absolute; top:8px; left:-14px; height:100%; width:14px;
    background:var(--panel-2); transform:skewY(-45deg);
  }
  .skew-social li a::after{
    content:''; position:absolute; bottom:-14px; left:-7px; height:14px; width:100%;
    background:var(--panel-2); transform:skewX(-45deg);
  }
  .skew-icon{ color:var(--brass); transition:.35s; line-height:0; }
  .skew-label{
    position:absolute; bottom:10px; inset-inline-start:18px;
    font-family:var(--mono); font-size:10.5px; color:var(--muted);
    letter-spacing:1px; transition:.35s; direction:ltr;
  }
  .skew-social li a:hover{
    transform:rotate(-18deg) skew(14deg) translate(10px,-10px);
    box-shadow:-24px 24px 24px rgba(0,0,0,0.4);
    background:var(--brass);
  }
  .skew-social li a:hover::before{ background:var(--brass-dim); }
  .skew-social li a:hover::after{ background:var(--brass-bright); }
  .skew-social li a:hover .skew-icon, .skew-social li a:hover .skew-label{ color:var(--ink-fixed); }
  .skew-social li:nth-child(2) a:hover{ background:var(--rust); }
  .skew-social li:nth-child(2) a:hover::before{ background:#1a7fae; }
  .skew-social li:nth-child(2) a:hover::after{ background:var(--rust-bright); }
  @media (max-width:600px){
    .skew-social li a{ width:120px; height:56px; }
    .skew-icon svg{ width:26px; height:26px; }
  }

  /* ---------- SHARE FAB ---------- */
  .share-fab{ position:fixed; bottom:22px; inset-inline-end:22px; z-index:120; }
  .music-fab{
    position:fixed; bottom:22px; inset-inline-end:86px; z-index:120;
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line); cursor:pointer;
    background:var(--panel); color:var(--brass);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,0.35); transition:transform .2s, color .2s;
  }
  .music-fab:hover{ transform:scale(1.06); color:var(--brass-bright); }

  /* ---------- GLOSSARY ---------- */
  .glossary-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); }
  @media (max-width:860px){ .glossary-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .glossary-grid{ grid-template-columns:1fr; } }
  .glossary-item{ background:var(--ink); padding:22px 20px; }
  .glossary-item h4{ font-family:var(--mono); font-size:13px; color:var(--brass); margin-bottom:8px; direction:ltr; text-align:right; }
  .glossary-item p{ color:var(--muted); font-size:13.5px; line-height:1.7; }

  /* ---------- GLOSSARY QUICK ACCESS ---------- */
  .glossary-access{
    display:flex; align-items:center; gap:16px;
    border:1px solid var(--line); background:var(--panel);
    padding:20px 22px; text-decoration:none; transition:border-color .2s, background .2s;
  }
  .glossary-access:hover{ border-color:var(--brass); background:rgba(154,82,255,0.05); }
  .glossary-access-icon{ color:var(--brass); flex-shrink:0; display:flex; }
  .glossary-access-text{ flex:1; display:flex; flex-direction:column; gap:3px; }
  .glossary-access-text strong{ font-family:var(--head); font-size:15px; color:var(--paper); }
  .glossary-access-text span{ font-size:12.5px; color:var(--muted); }
  .glossary-access-arrow{ color:var(--muted); font-size:18px; flex-shrink:0; }

  /* ---------- FLOW DIAGRAM ---------- */
  .flow-diagram{ display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center; gap:4px 2px; margin-bottom:10px; }
  .flow-step{ display:flex; flex-direction:column; align-items:center; width:108px; text-align:center; }
  .flow-dot{
    width:42px; height:42px; border-radius:50%; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:15px; color:var(--muted); margin-bottom:10px;
    animation:flowPulse 3s ease-in-out infinite;
  }
  .flow-step p{ font-size:12px; color:var(--muted); line-height:1.5; }
  .flow-arrow{ color:var(--line); font-size:20px; margin-top:9px; flex-shrink:0; }
  @keyframes flowPulse{
    0%, 80%, 100%{ border-color:var(--line); color:var(--muted); box-shadow:none; }
    15%{ border-color:var(--brass); color:var(--brass); box-shadow:0 0 16px rgba(154,82,255,0.5); }
  }
  .share-fab-btn{
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--brass), var(--rust));
    color:var(--ink-fixed); display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    transition:transform .2s;
  }
  .share-fab-btn:hover{ transform:scale(1.06); }
  .share-menu{
    position:absolute; bottom:64px; inset-inline-end:0;
    background:var(--panel); border:1px solid var(--line);
    min-width:170px; padding:8px;
    display:flex; flex-direction:column; gap:2px;
    opacity:0; pointer-events:none; transform:translateY(8px);
    transition:.2s;
  }
  .share-menu.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .share-item{
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    background:none; border:none; width:100%; text-align:start; cursor:pointer;
    color:var(--text); font-family:var(--body); font-size:14px; text-decoration:none;
    border-radius:2px; transition:background .2s;
  }
  .share-item:hover{ background:var(--panel-2); color:var(--brass); }

  /* ---------- iOS 26 LIQUID GLASS DOCK ---------- */
  .ios-dock{
    position:fixed; bottom:22px; inset-inline-start:16px; z-index:125;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .dock-options{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:9px 7px; border-radius:30px;
    background:var(--glass-bg);
    backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow:0 12px 34px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.25);
    transform-origin:bottom center;
    opacity:0; visibility:hidden; pointer-events:none; transform:translateY(16px) scale(.86);
    transition:opacity .22s ease, transform .25s ease, visibility 0s linear .25s;
  }
  .ios-dock.open .dock-options{
    opacity:1; visibility:visible; pointer-events:auto; transform:none;
    transition:opacity .22s ease, transform .25s ease, visibility 0s;
  }
  .dock-options::before{
    content:''; position:absolute; inset:3px 3px auto 3px; height:42%;
    border-radius:24px 24px 60% 60%/24px 24px 30px 30px;
    background:linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0));
    pointer-events:none; opacity:.5;
  }
  .dock-more{
    position:relative; width:52px; height:52px; border-radius:50%; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:var(--glass-bg); color:var(--brass-bright);
    backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow:0 10px 28px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.25);
    transition:transform .2s, background .25s, color .25s;
  }
  .dock-more:active{ transform:scale(.94); }
  .dock-more svg{ transition:transform .3s ease; }
  .ios-dock.open .dock-more{ background:linear-gradient(135deg, var(--brass), var(--rust)); color:#fff; border-color:transparent; }
  .ios-dock.open .dock-more svg{ transform:rotate(90deg); }
  .dock-slot{
    position:relative; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:transparent; color:var(--brass-bright);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:transform .2s, background .2s;
  }
  .dock-slot:hover{ transform:scale(1.08); background:var(--glass-border); }
  .dock-slot.active{ background:linear-gradient(135deg, var(--brass), var(--rust)); color:var(--ink-fixed); }
  .dock-divider{ width:24px; height:1px; background:var(--glass-border); margin:1px 0; }
  .dock-pop{
    position:fixed; top:auto; bottom:22px; inset-inline-start:78px; transform:translateX(-10px); max-height:calc(100vh - 44px); overflow-y:auto;
    z-index:124; width:240px; max-width:min(74vw, 240px);
    background:var(--panel);
    backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--line); border-radius:18px;
    padding:16px; box-shadow:0 18px 40px rgba(0,0,0,0.55);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .dock-pop.open{ opacity:1; pointer-events:auto; transform:translateX(0); }
  .dock-pop h5{ font-family:var(--head); font-size:13.5px; color:var(--paper); margin-bottom:10px; }
  .dock-contact-link{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:10px; color:var(--text); text-decoration:none; font-size:13.5px; transition:background .2s, color .2s; word-break:break-all; }
  .dock-contact-link:hover{ background:rgba(255,255,255,0.09); color:var(--brass-bright); }
  .dock-search-input{
    width:100%; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.2);
    border-radius:12px; padding:9px 12px; color:var(--paper); font-family:var(--body); font-size:14px;
    outline:none; margin-bottom:10px; box-sizing:border-box;
  }
  .dock-search-input::placeholder{ color:var(--muted); }
  .dock-search-results{ max-height:240px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .dock-search-item{ display:block; width:100%; text-align:start; background:none; border:none; padding:8px 8px; border-radius:8px; color:var(--text); font-size:13px; cursor:pointer; transition:background .2s, color .2s; font-family:var(--body); }
  .dock-search-item:hover{ background:rgba(255,255,255,0.09); color:var(--brass-bright); }
  .dock-search-empty{ color:var(--muted); font-size:12.5px; padding:6px 8px; }
  .dock-search-tag{ display:inline-block; font-family:var(--mono); font-size:10px; color:var(--brass); margin-inline-end:6px; }
  .search-highlight{ outline:2px solid var(--brass-bright); outline-offset:6px; border-radius:4px; }
  @media (max-width:640px){
    .ios-dock{ inset-inline-start:14px; }
    .dock-pop{ inset-inline-start:72px; }
  }

  /* ---------- PROFILE / POINTS / BADGES ---------- */
  .dock-pop-profile{ width:270px; max-width:min(80vw, 270px); }
  .vn-profile-level{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .vn-level-icon{ font-size:28px; line-height:1; }
  .vn-level-name{ font-family:var(--head); font-size:14px; color:var(--paper); }
  .vn-level-points{ font-size:12px; color:var(--muted); margin-top:2px; }
  .vn-level-bar{ height:6px; border-radius:4px; background:rgba(255,255,255,0.1); overflow:hidden; margin-bottom:6px; }
  .vn-level-bar-fill{ height:100%; background:linear-gradient(90deg, var(--brass), var(--rust-bright)); border-radius:4px; transition:width .4s ease; }
  .vn-level-next{ font-size:11px; color:var(--muted); margin-bottom:14px; }
  .vn-badges-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  .vn-badge-chip{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; border-radius:10px; background:rgba(255,255,255,0.04); text-align:center; opacity:.45; transition:opacity .2s, background .2s; }
  .vn-badge-chip.earned{ opacity:1; background:rgba(154,82,255,0.12); }
  .vn-badge-icon{ font-size:18px; }
  .vn-badge-name{ font-size:9.5px; color:var(--text); line-height:1.3; }

  .vn-toast{
    position:fixed; bottom:26px; left:50%; z-index:400;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel); border:1px solid var(--glass-border);
    backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
    border-radius:14px; padding:12px 22px; display:flex; flex-direction:column; align-items:center; gap:2px;
    box-shadow:0 14px 30px rgba(0,0,0,0.4), 0 0 20px rgba(154,82,255,0.15);
    opacity:0; transition:opacity .3s ease, transform .3s ease; pointer-events:none; max-width:84vw; text-align:center;
  }
  .vn-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .vn-toast-title{ font-family:var(--head); font-weight:800; font-size:14.5px; color:var(--brass-bright); }
  .vn-toast-sub{ font-size:12px; color:var(--muted); }
  /* ---------- FEEDBACK / RATING ---------- */
  .fb-stars{ display:flex; gap:8px; margin-bottom:16px; }
  .fb-star{
    background:none; border:none; cursor:pointer; padding:0;
    font-size:28px; line-height:1; color:var(--line); transition:color .15s, transform .15s;
  }
  .fb-star:hover, .fb-star.active{ color:var(--brass-bright); transform:scale(1.12); }
  .fb-textarea{
    width:100%; min-height:110px; background:var(--panel); border:1px solid var(--line);
    color:var(--text); font-family:var(--body); font-size:14.5px; padding:12px 14px;
    border-radius:4px; resize:vertical; outline:none; box-sizing:border-box; transition:border-color .2s;
  }
  .fb-textarea:focus{ border-color:var(--brass); }
  .fb-status{ font-size:13px; margin-top:10px; min-height:18px; }

  /* ---------- SCROLL REVEAL ---------- */
  .reveal{ opacity:0; transform:translateY(26px); transition:opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1); }
  .reveal.revealed{ opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; transition:none; }
  }

  /* ---------- MICRO-INTERACTIONS ---------- */
  .mm-ripple-host{ position:relative; overflow:hidden; }
  .mm-ripple{
    position:absolute; border-radius:50%; background:rgba(255,255,255,0.4);
    transform:scale(0); opacity:0.55; pointer-events:none;
    animation:mmRippleAnim .55s ease-out forwards;
  }
  @keyframes mmRippleAnim{ to{ transform:scale(1); opacity:0; } }
  .btn, .gl-btn, .dock-slot, .lesson-toggle, .incident-btn, .share-fab-btn, .music-fab,
  .quiz-option, .lg-option, .hv-card, .dock-search-item, .glossary-access, .dock-contact-link{
    transition:transform .15s ease;
  }
  .btn:active, .gl-btn:active, .dock-slot:active, .lesson-toggle:active, .incident-btn:active, .share-fab-btn:active, .music-fab:active,
  .quiz-option:active, .lg-option:active, .hv-card:active, .dock-search-item:active, .glossary-access:active, .dock-contact-link:active{
    transform:scale(0.95);
  }

  /* ---------- CODE SNIPPET BLOCK ---------- */
  .code-block{
    background:var(--ink); border:1px solid var(--line); border-radius:4px;
    padding:14px 18px; margin:14px 0; font-family:var(--mono); font-size:13px;
    color:#8bd4ff; white-space:pre-wrap; direction:ltr; text-align:left; overflow-x:auto; line-height:1.6;
  }
  .code-block .cm{ color:#6a9955; }
  .code-block .ck{ color:#c4b5fd; }

  footer .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px;}

  ::selection{background:var(--brass); color:var(--ink-fixed);}

  /* ---------- GLITCH TICKER ---------- */
  .glitch-strip{background:#080808; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:14px 0;}
  .glitch-text{
    font-family:var(--mono); font-size:13.5px; color:var(--text);
    position:relative; display:inline-block;
  }
  .glitch-text::before, .glitch-text::after{
    content:attr(data-text); position:absolute; top:0; right:0; width:100%;
    overflow:hidden; background:#080808; white-space:nowrap;
  }
  .glitch-text::before{ color:var(--rust); clip-path:polygon(0 0,100% 0,100% 45%,0 45%); animation:glitchTop 4.5s infinite linear; }
  .glitch-text::after{ color:var(--brass); clip-path:polygon(0 55%,100% 55%,100% 100%,0 100%); animation:glitchBottom 4.5s infinite linear; }
  @keyframes glitchTop{
    0%,88%,100%{ transform:translate(0,0); }
    90%{ transform:translate(2px,-1px); } 92%{ transform:translate(-2px,1px); } 94%{ transform:translate(1px,1px); }
  }
  @keyframes glitchBottom{
    0%,88%,100%{ transform:translate(0,0); }
    89%{ transform:translate(-2px,1px); } 91%{ transform:translate(2px,-1px); } 95%{ transform:translate(-1px,-1px); }
  }

  /* ---------- GLOBE ---------- */
  .globe-wrap{display:flex; justify-content:center; padding:10px 0 8px;}
  .globe{width:100%; max-width:360px; height:auto;}
  .pulse-ring{
    fill:none; stroke-width:1.4; transform-box:fill-box; transform-origin:center;
    animation:pulseRing 2.4s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ transform:scale(0.4); opacity:.9; }
    100%{ transform:scale(6); opacity:0; }
  }
  .globe-legend{display:flex; justify-content:center; gap:28px; margin-top:8px;}
  .globe-legend span{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted);}
  .globe-legend i{width:8px; height:8px; display:inline-block; border-radius:50%;}

  /* ---------- LIVE THREAT MAP ---------- */
  .threatmap-frame-wrap{
    max-width:900px; margin:0 auto; border:1px solid var(--line); border-radius:4px;
    overflow:hidden; background:#000; box-shadow:var(--glass-shadow);
  }
  .threatmap-frame-wrap iframe{ display:block; width:100%; min-height:300px; }
  .threatmap-credit{ text-align:center; margin-top:14px; font-size:12px; color:var(--muted); }
  .threatmap-credit a{ color:var(--rust); }

  /* ---------- PHISHING SIMULATOR ---------- */
  .phish-progress{ font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:14px; text-align:center; }
  .phish-email{
    background:#f4f5f7; color:#1a1a1a; border-radius:6px; overflow:hidden;
    border:1px solid rgba(0,0,0,0.08); margin-bottom:20px; max-width:480px; margin-inline:auto;
    box-shadow:0 10px 26px rgba(0,0,0,0.25);
  }
  .phish-email-head{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid #e4e6eb; }
  .phish-avatar{
    width:36px; height:36px; border-radius:50%; background:#dbe2ea;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
    flex-shrink:0; color:#505866;
  }
  .phish-from-name{ font-weight:700; font-size:13.5px; color:#15181d; }
  .phish-from-addr{ font-size:11.5px; color:#8a909c; direction:ltr; text-align:right; }
  .phish-subject{ padding:12px 16px 0; font-weight:700; font-size:14px; color:#15181d; }
  .phish-body{ padding:10px 16px 16px; font-size:13px; line-height:1.8; color:#33373e; }
  .phish-cta-wrap{ padding:0 16px 20px; }
  .phish-cta-btn{
    display:inline-block; background:#2563eb; color:#fff; padding:10px 22px;
    border-radius:5px; font-size:13px; font-weight:600;
  }
  .phish-link-line{ padding:0 16px 18px; font-size:11px; color:#8a909c; direction:ltr; text-align:left; word-break:break-all; }

  .phish-chips{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; justify-content:center; }
  .phish-chip{
    font-family:var(--mono); font-size:12.5px; padding:8px 14px; border-radius:20px;
    border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer;
    transition:all .2s;
  }
  .phish-chip:hover:not(:disabled){ border-color:var(--rust); }
  .phish-chip.selected{ border-color:var(--rust); background:rgba(61,139,255,0.14); color:var(--rust-bright); }
  .phish-chip.result-correct{ border-color:var(--brass); background:rgba(154,82,255,0.16); color:var(--brass-bright); }
  .phish-chip.result-missed{ border-color:#ef4444; background:rgba(239,68,68,0.16); color:#ff8fa3; }
  .phish-chip.result-wrong{ border-color:#ef4444; background:rgba(239,68,68,0.08); color:#ff8fa3; opacity:.7; }
  .phish-chip:disabled{ cursor:default; }
  .phish-feedback-item{ font-size:12.5px; color:var(--muted); padding:9px 2px; border-bottom:1px dashed var(--line); text-align:start; }
  .phish-feedback-item strong{ color:var(--text); }
  .phish-score-box{ text-align:center; padding:20px 10px 10px; }
  .phish-score-box .big{ font-size:38px; font-weight:900; color:var(--brass-bright); font-family:var(--mono); }

  /* ---------- PASSWORD TOOLS ---------- */
  .pwgen-options{ display:flex; flex-direction:column; gap:16px; margin-bottom:18px; }
  .pwgen-row{ display:flex; flex-direction:column; gap:8px; font-size:13px; color:var(--text); }
  .pwgen-row input[type="range"]{ width:100%; accent-color:var(--brass); }
  .pwgen-check{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); cursor:pointer; }
  .pwgen-check input{ accent-color:var(--brass); width:16px; height:16px; }
  .pwgen-output-row{ display:flex; gap:10px; }
  .pwgen-output{
    flex:1; background:var(--ink); border:1px solid var(--line); border-radius:4px;
    padding:12px 14px; font-family:var(--mono); font-size:14px; color:var(--brass-bright);
    direction:ltr; text-align:left; min-width:0;
  }
  .pwned-result{ margin-top:16px; padding:14px 16px; border-radius:4px; font-size:13.5px; display:none; line-height:1.7; }
  .pwned-result.show{ display:block; }
  .pwned-result.safe{ background:rgba(154,82,255,0.1); border:1px solid var(--brass); color:var(--brass-bright); }
  .pwned-result.danger{ background:rgba(239,68,68,0.1); border:1px solid #ef4444; color:#ff8fa3; }
  .pwned-result.loading{ background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--muted); }
  .pwned-result.error{ background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--muted); }

  /* ---------- SMS/WHATSAPP PHISHING SIMULATOR ---------- */
  .sms-phone{
    max-width:360px; margin:0 auto 20px; background:#0b141a; border-radius:18px;
    padding:16px 14px; border:1px solid rgba(255,255,255,0.08); box-shadow:0 10px 26px rgba(0,0,0,0.3);
  }
  .sms-sender-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .sms-avatar{ width:32px; height:32px; border-radius:50%; background:#2a3942; display:flex; align-items:center; justify-content:center; font-weight:700; color:#8696a0; font-size:13px; flex-shrink:0; }
  .sms-sender-name{ color:#e9edef; font-size:13.5px; font-weight:600; }
  .sms-sender-number{ color:#8696a0; font-size:11px; direction:ltr; text-align:right; }
  .sms-bubble{
    background:#202c33; color:#e9edef; border-radius:8px; padding:10px 12px;
    font-size:13px; line-height:1.7; max-width:92%; margin-bottom:8px;
  }

  /* ---------- VOICE PHISHING (VISHING) SIMULATOR ---------- */
  .vish-callbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.08);

  .vish-call-status{ font-size:12.5px; color:#8696a0; display:flex; align-items:center; gap:6px; }
  .vish-call-status .dot{
    width:8px; height:8px; border-radius:50%; background:#22c55e; display:inline-block;
    animation:vish-pulse 1.4s infinite;
  }
  @keyframes vish-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .vish-callbar .btn{ font-size:12px; padding:7px 14px; }
  .vish-unsupported{ font-size:11.5px; color:var(--muted); }

  /* ---------- COMPLETION CERTIFICATE ---------- */
  .cert-stats{ margin-bottom:18px; }
  .cert-stats p{ font-size:14px; }

  /* ---------- HABIT TRACKER ---------- */
  .habit-list{ display:flex; flex-direction:column; gap:14px; }
  .habit-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 16px; border:1px solid var(--line); border-radius:6px; background:var(--panel-2);
    flex-wrap:wrap;
  }
  .habit-info{ display:flex; align-items:center; gap:12px; flex:1; min-width:200px; }
  .habit-icon{ font-size:22px; flex-shrink:0; }
  .habit-label{ font-size:13.5px; color:var(--text); }
  .habit-streak{ font-family:var(--mono); font-size:12px; color:var(--brass-bright); white-space:nowrap; }
  .habit-btn{
    font-family:var(--mono); font-size:12px; padding:8px 14px; border-radius:20px;
    border:1px solid var(--brass); background:transparent; color:var(--brass-bright); cursor:pointer;
    white-space:nowrap; transition:all .2s;
  }
  .habit-btn:hover:not(:disabled){ background:rgba(154,82,255,0.1); }
  .habit-btn.done-today{ background:rgba(154,82,255,0.18); cursor:default; }

  /* ---------- TERMINAL ---------- */
  .terminal{border:1px solid var(--line); background:#080808; max-width:640px; margin:0 auto;}
  .terminal-bar{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel-2);}
  .term-dot{width:9px; height:9px; border-radius:50%; background:var(--line);}
  .term-dot:nth-child(3){background:var(--brass-dim);}

  .terminal-body{

  .shell-output .shell-err{ color:#ff5f56; }
  .shell-output .shell-ok{ color:#c4b5fd; }
  .shell-output .shell-muted{ color:#6a7280; }
  .shell-input-row{

    margin-bottom:2px; text-align:center; position:relative; z-index:2;
  }
  .gl-sub{
    font-family:'Poppins','Tajawal',sans-serif; color:rgba(255,255,255,0.5); font-size:10.5px;
    margin-bottom:14px; text-align:center; position:relative; z-index:2;
  }

  .gl-input-group .gl-icon{

  }
  .gl-input-group .gl-eye{

  .gl-error{

  }

  .gl-contact p{ color:rgba(255,255,255,0.4); font-size:9px; font-family:'Poppins','Tajawal',sans-serif; margin-bottom:3px; }
  .gl-contact a{ color:#c77dff; font-size:9.5px; font-family:var(--mono); text-decoration:none; direction:ltr; display:inline-block; }
  .gl-contact a:hover{ color:#e0aaff; }

  @keyframes lcPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .box{
    position:relative; width:min(370px, calc(100vw - 32px)); height:545px;
    background:#0e0b16; border-radius:50px 5px; overflow:hidden;
    box-shadow:0 0 40px rgba(110,90,255,.28);
  }
  .box::before, .box::after{
    content:''; position:absolute; top:-50%; left:-50%; width:100%; height:100%;
    background:linear-gradient(0deg, transparent, transparent, #c77dff, #c77dff, #c77dff);
    transform-origin:bottom right; animation:lcSpin 6s linear infinite;
  }
  .box::after{
    background:linear-gradient(0deg, transparent, transparent, #3d8bff, #3d8bff, #3d8bff);
    animation-delay:-3s;
  }
  @keyframes lcSpin{ 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }
  .box form{
    position:absolute; inset:2px; border-radius:8px; background:#14101e; z-index:10;
    padding:50px 40px; display:flex; flex-direction:column; margin:0;
  }
  .box h2{
    font-family:'Orbitron','Poppins',sans-serif; font-weight:800; text-align:center; direction:ltr;
    letter-spacing:.06em; font-size:1.75em; margin:0; line-height:1.2;
  }
  .box h2 .lc-t1{
    background:linear-gradient(90deg,#6d28d9,#b36bff); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:#a45cff; filter:drop-shadow(0 0 8px rgba(154,82,255,.6));
  }
  .box h2 .lc-t2{ color:#fff; text-shadow:0 0 12px rgba(96,165,250,.85); }
  .input-box{ position:relative; width:100%; margin-top:35px; }
  .input-box input{
    position:relative; width:100%; box-sizing:border-box; padding:20px 10px 10px; background:transparent;
    border:none; outline:none; box-shadow:none; color:#1a0f2e; font-size:16px;
    font-family:'Poppins','Tajawal',sans-serif; letter-spacing:.05em; transition:.5s; z-index:10;
  }
  .input-box span{
    position:absolute; inset-inline-start:0; padding:20px 0 10px; pointer-events:none; font-size:16px;
    font-family:'Poppins','Tajawal',sans-serif; color:#8f8f8f; letter-spacing:.05em; transition:.5s;
  }
  .input-box input:focus ~ span, .input-box input:not(:placeholder-shown) ~ span{
    color:#c77dff; transform:translateY(-34px); font-size:.75em;
  }
  .input-box i{
    position:absolute; left:0; bottom:0; width:100%; height:2px; background:#c77dff; border-radius:4px;
    transition:.5s; pointer-events:none; z-index:9;
  }
  .input-box input:focus ~ i, .input-box input:not(:placeholder-shown) ~ i{ height:44px; }
  .input-box .gl-eye{
    position:absolute; inset-inline-end:8px; bottom:13px; z-index:11; display:flex; cursor:pointer; color:#8f8f8f; transition:.5s;
  }
  .input-box input:focus ~ .gl-eye, .input-box input:not(:placeholder-shown) ~ .gl-eye{ color:#1a0f2e; }
  #lock-input{ padding-inline-end:36px; }
  .lc-submit{
    border:none; outline:none; padding:11px 25px; background:linear-gradient(90deg,#9a52ff,#3d8bff); color:#fff;
    cursor:pointer; font-size:.95em; border-radius:30px; font-weight:600; width:100%; margin-top:16px;
    font-family:'Poppins','Tajawal',sans-serif; box-shadow:0 4px 15px rgba(90,110,255,.45);
  }
  .lc-submit:active{ opacity:.8; }
  .box .gl-error{ margin-top:8px; }
  .box .links{ display:flex; justify-content:space-between; gap:6px; margin-top:auto; }
  .box .links a{ margin:10px 0 0; font-size:.7em; white-space:nowrap; color:#8f8f8f; text-decoration:none; font-family:'Poppins','Tajawal',sans-serif; }
  .box .links a:hover, .box .links a:nth-child(2){ color:#c77dff; }
  .box .links a:nth-child(2){ direction:ltr; }
  @media (max-height:600px){ .box{ height:500px; } .box form{ padding:32px 36px; } .input-box{ margin-top:28px; } }

  #site-content{display:none;}

  /* ---------- CONNECTING SCREEN ---------- */
  #connecting-screen{
    position:fixed; inset:0; z-index:999; background:#000;
    display:none; align-items:center; justify-content:center; flex-direction:column;
  }
  .cn-text{
    font-family:'Press Start 2P', monospace; color:#c4b5fd; font-size:22px;
    margin-bottom:26px; letter-spacing:1px;
  }
  .cn-bar-outer{
    width:280px; height:34px; border:3px solid #c4b5fd; border-radius:17px;
    padding:5px; box-sizing:border-box;
  }
  .cn-bar-fill{
    height:100%; width:0%; background:#c4b5fd; border-radius:12px;
    animation:cnFill 1.8s steps(24) forwards;
  }
  @keyframes cnFill{ to{ width:100%; } }

  /* ---------- INTRO ANIMATION (matrix rain + terminal boot) ---------- */
  #intro-anim-screen{
    position:fixed; inset:0; z-index:999; background:#05050a;
    display:none; align-items:center; justify-content:center; flex-direction:column;
    overflow:hidden; opacity:1; transition:opacity .5s ease;
  }
  #intro-anim-screen.fade-out{ opacity:0; }
  #matrix-canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .intro-boot{
    position:relative; z-index:2; width:min(560px, 86vw);
    background:rgba(8,8,14,0.58); border:1px solid rgba(154,82,255,0.4);
    border-radius:6px; padding:24px 26px; backdrop-filter:blur(2px);
    box-shadow:0 0 40px rgba(154,82,255,0.18);
  }
  .intro-boot-line{
    font-family:var(--mono); font-size:13.5px; color:#c4b5fd; line-height:1.9;
    white-space:pre-wrap; direction:rtl; text-align:right;
  }
  .video-skip{
    position:absolute; top:24px; inset-inline-end:24px; z-index:3;
    font-family:var(--mono); font-size:12px; color:var(--muted);
    background:rgba(255,255,255,0.06); border:1px solid var(--line);
    padding:8px 16px; cursor:pointer;
  }
  .video-skip:hover{ color:var(--brass); border-color:var(--brass); }

  /* ---------- LESSON QUIZZES ---------- */
  .quiz-score-badge{
    display:none; font-family:var(--mono); font-size:11px; color:var(--brass);
    border:1px solid var(--brass-dim); padding:2px 8px; border-radius:10px; margin-inline-start:8px; flex-shrink:0;
  }
  .btn-quiz{ border-color:var(--rust); color:var(--rust-bright); margin-top:6px; }
  .btn-listen{ border-color:var(--brass); color:var(--brass-bright); margin-top:0; margin-bottom:12px; display:inline-flex; align-items:center; gap:6px; }
  .btn-listen:hover{ background:rgba(154,82,255,0.1); border-color:var(--brass-bright); }
  .btn-listen.listening{ background:rgba(154,82,255,0.16); border-color:var(--brass-bright); animation:listenPulse 1.4s ease-in-out infinite; }
  @keyframes listenPulse{ 0%,100%{ box-shadow:0 0 0 rgba(154,82,255,0.35); } 50%{ box-shadow:0 0 14px rgba(154,82,255,0.5); } }
  .btn-quiz:hover{ background:rgba(61,139,255,0.1); border-color:var(--rust-bright); }
  .quiz-host{ margin-top:16px; }
  .quiz-panel{ background:var(--ink); border:1px solid var(--line); padding:24px 22px; margin-top:4px; }
  .quiz-progress{ font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-bottom:12px; }
  .quiz-question{ font-family:var(--head); font-size:16px; color:var(--paper); margin-bottom:16px; line-height:1.6; }
  .quiz-options{ display:grid; gap:10px; margin-bottom:4px; }
  .quiz-option{
    text-align:right; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:12px 16px; font-size:14.5px; font-family:'Tajawal',sans-serif; cursor:pointer; transition:.2s; border-radius:3px;
  }
  .quiz-option:hover:not(:disabled){ border-color:var(--rust); }
  .quiz-option:disabled{ cursor:default; }
  .quiz-option.correct{ border-color:var(--brass); background:rgba(154,82,255,0.12); color:var(--brass-bright); }
  .quiz-option.wrong{ border-color:#ef4444; background:rgba(239,68,68,0.12); color:#ff8fa3; }
  .quiz-explain{ margin-top:16px; padding:14px 16px; background:var(--panel-2); border-inline-start:3px solid var(--rust); font-size:14px; color:var(--muted); line-height:1.7; }
  .quiz-nav{ margin-top:18px; text-align:center; }
  .quiz-result{ text-align:center; }
  .quiz-score{ font-family:var(--mono); font-size:40px; color:var(--brass-bright); margin-bottom:10px; }
  .quiz-result p{ color:var(--muted); font-size:15px; margin-bottom:20px; }

  /* ---------- PASSWORD STRENGTH TOOL ---------- */
  .tool-card{ max-width:620px; margin:0 auto; background:var(--panel-2); border:1px solid var(--line); padding:34px 30px; }
  .pw-input-group{ position:relative; margin-bottom:18px; }
  .pw-test-input{
    width:100%; height:48px; background:var(--ink); border:1px solid var(--line); border-radius:4px;
    padding-inline-start:16px; padding-inline-end:48px; color:var(--paper); font-family:var(--mono); font-size:15px;
    outline:none; transition:.25s;
  }
  .pw-test-input:focus{ border-color:var(--brass); }
  .pw-eye{
    position:absolute; inset-inline-end:12px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-size:16px; opacity:.6; line-height:1;
  }
  .pw-eye:hover{ opacity:1; }
  .pw-meter{ height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:10px; }
  .pw-meter-fill{ height:100%; width:0%; background:var(--line); transition:width .3s ease, background .3s ease; display:block; }
  .pw-label{ font-family:var(--mono); font-size:14px; color:var(--muted); margin-bottom:14px; min-height:18px; transition:color .3s; }
  .pw-crack-time{
    display:none; align-items:center; gap:10px; font-size:13px; color:var(--muted);
    background:var(--ink); border:1px solid var(--line); border-radius:6px;
    padding:12px 14px; margin-bottom:22px; transition:border-color .3s, color .3s;
  }
  .pw-crack-time.show{ display:flex; }
  .pw-crack-time .pct-icon{ font-size:17px; flex-shrink:0; }
  .pw-crack-time.weak{ border-color:#ef4444; color:#ff8fa3; }
  .pw-crack-time.medium{ border-color:#eab308; color:#fde68a; }
  .pw-crack-time.strong{ border-color:var(--rust); color:var(--rust-bright); }
  .pw-crack-time.excellent{ border-color:var(--brass); color:var(--brass-bright); }
  .pw-criteria{ list-style:none; display:grid; gap:10px; margin-bottom:22px; padding:0; }
  .pw-criteria li{ font-size:14px; color:var(--muted); display:flex; align-items:center; gap:10px; transition:color .25s; }
  .pw-criteria li.ok{ color:var(--text); }
  .pw-c-icon{
    width:20px; height:20px; border:1px solid var(--line); border-radius:50%; display:inline-flex;
    align-items:center; justify-content:center; font-size:11px; flex-shrink:0; transition:.25s; color:var(--muted);
  }
  .pw-criteria li.ok .pw-c-icon{ border-color:var(--brass); color:var(--brass); background:rgba(154,82,255,0.1); }
  .pw-note{ font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:18px; line-height:1.7; }

  /* ---------- LINK-SPOTTING GAME ---------- */
  .lg-options{ display:grid; gap:12px; margin-bottom:4px; }
  .lg-option{
    width:100%; text-align:left; direction:ltr;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:14px 18px; font-size:13.5px; font-family:var(--mono); cursor:pointer; transition:.2s; border-radius:3px;
    word-break:break-all;
  }
  .lg-option:hover:not(:disabled){ border-color:var(--rust); }
  .lg-option:disabled{ cursor:default; }
  .lg-option.correct{ border-color:var(--brass); background:rgba(154,82,255,0.12); color:var(--brass-bright); }
  .lg-option.wrong{ border-color:#ef4444; background:rgba(239,68,68,0.12); color:#ff8fa3; }

  /* ---------- INCIDENT RESPONSE WIZARD ---------- */
  .incident-selector{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:26px; }
  @media (max-width:700px){ .incident-selector{ grid-template-columns:repeat(2,1fr); } }
  .incident-btn{
    background:var(--ink); border:1px solid var(--line); color:var(--text);
    padding:16px 10px; font-size:14px; font-family:'Tajawal',sans-serif; cursor:pointer;
    transition:.2s; border-radius:3px; text-align:center;
  }
  .incident-btn:hover{ border-color:var(--rust); color:var(--rust-bright); }
  .incident-btn.active{ border-color:var(--brass); background:rgba(154,82,255,0.1); color:var(--brass-bright); }
  .incident-steps{ counter-reset:incstep; list-style:none; padding:0; }
  .incident-steps li{
    counter-increment:incstep; position:relative; padding:14px 0; padding-inline-start:46px;
    border-bottom:1px solid var(--line); color:var(--text); font-size:14.5px; line-height:1.7;
  }
  .incident-steps li:last-child{ border-bottom:none; }
  .incident-steps li::before{
    content:counter(incstep); position:absolute; inset-inline-start:0; top:12px;
    width:30px; height:30px; border-radius:50%; background:var(--brass-dim); color:var(--ink-fixed);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:13px; flex-shrink:0;
  }
  .incident-note{ margin-top:18px; padding:14px 16px; background:var(--ink); border-inline-start:3px solid var(--rust); font-size:13.5px; color:var(--muted); line-height:1.7; }
  .incident-hint{ text-align:center; color:var(--muted); font-size:14px; padding:18px 0 6px; }
  .inc-alert{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px; margin-bottom:22px; background:rgba(61,139,255,0.08); border:1px solid var(--rust); border-radius:3px; font-size:13.5px; line-height:1.8; color:var(--text); }
  .inc-alert strong{ color:var(--rust-bright); }
  .inc-progress{ display:flex; align-items:center; gap:12px; margin:0 0 8px; }
  .inc-progress-bar{ flex:1; height:8px; background:var(--ink); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .inc-progress-fill{ height:100%; width:0; background:var(--brass); transition:width .3s; }
  .inc-progress-text{ font-family:var(--mono); font-size:12px; color:var(--brass-bright); white-space:nowrap; }
  .incident-steps li.inc-step{ cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  .incident-steps li.inc-step:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .incident-steps li.inc-step.done{ color:var(--muted); }
  .incident-steps li.inc-step.done .inc-text{ text-decoration:line-through; }
  .incident-steps li.inc-step::before{ color:#fff; }
  .incident-steps li.inc-step.done::before{ content:'\2713'; background:var(--brass); }
  .inc-now{ display:inline-block; margin-inline-end:8px; padding:1px 9px; font-size:11px; font-weight:700; color:var(--rust-bright); border:1px solid var(--rust); border-radius:99px; vertical-align:middle; }
  .inc-done{ display:none; margin-top:18px; padding:14px 16px; border:1px solid var(--brass); background:rgba(154,82,255,0.1); border-radius:3px; color:var(--brass-bright); font-size:14px; line-height:1.7; }
  .inc-done.show{ display:block; }
  .inc-warn-wrap{ margin-top:20px; padding:16px; background:var(--ink); border:1px dashed var(--line); border-radius:3px; }
  .inc-warn-wrap h4{ font-family:var(--head); font-size:14.5px; color:var(--paper); margin-bottom:8px; }
  .inc-warnbox{ font-size:13.5px; color:var(--text); line-height:1.9; margin-bottom:12px; }
  .inc-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }

  /* ---------- VX TOOLS (message checker, photo privacy, local scams, safety check) ---------- */
  .vx-textarea{
    width:100%; min-height:130px; box-sizing:border-box; background:var(--ink); border:1px solid var(--line);
    color:var(--text); border-radius:6px; padding:14px; font-size:16px; font-family:'Tajawal',sans-serif;
    line-height:1.7; resize:vertical;
  }
  .vx-textarea:focus{ outline:none; border-color:var(--brass); }
  .vx-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .vx-result{ margin-top:22px; }
  .vx-meter{ height:12px; background:var(--ink); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .vx-meter-fill{ height:100%; width:0; transition:width .5s; }
  .vx-level{ font-family:var(--head); font-size:18px; margin:12px 0 6px; }
  .vx-sub{ color:var(--muted); font-size:14px; line-height:1.8; margin-bottom:6px; }
  .vx-list{ list-style:none; padding:0; margin:12px 0 0; }
  .vx-list li{
    padding:10px 12px; margin-bottom:8px; background:var(--ink); border-inline-start:3px solid var(--rust);
    font-size:14px; line-height:1.8; color:var(--text);
  }
  .vx-list li small{ display:block; color:var(--muted); font-size:12.5px; }
  .vx-list code, .vx-host{
    direction:ltr; unicode-bidi:embed; display:inline-block; font-family:var(--mono); font-size:12.5px;
    color:var(--brass-bright); word-break:break-all;
  }
  .vx-h4{ font-family:var(--head); font-size:14.5px; color:var(--paper); margin:18px 0 6px; }
  .vx-photo-grid{ display:grid; grid-template-columns:140px 1fr; gap:18px; align-items:start; }
  @media (max-width:560px){ .vx-photo-grid{ grid-template-columns:1fr; } }
  .vx-photo-grid img{ max-width:100%; max-height:220px; border-radius:6px; border:1px solid var(--line); display:block; }
  .vx-table{ width:100%; border-collapse:collapse; font-size:14px; }
  .vx-table td{ padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.7; }
  .vx-table td:first-child{ color:var(--muted); width:36%; }
  .vx-table td:last-child{ direction:ltr; text-align:left; font-family:var(--mono); font-size:13px; word-break:break-word; }
  .vx-verdict{ padding:12px 14px; border-radius:4px; font-size:14px; line-height:1.8; margin-bottom:14px; border:1px solid; }
  .vx-verdict.bad{ border-color:#ef4444; background:rgba(239,68,68,0.1); color:#ff8fa3; }
  .vx-verdict.mid{ border-color:#fbbf24; background:rgba(251,191,36,0.08); color:#fcd34d; }
  .vx-verdict.ok{ border-color:#4ade80; background:rgba(74,222,128,0.08); color:#86efac; }
  .vx-clean-box{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); }
  .vx-clean-box img{ max-height:160px; margin:12px 0; }
  .vx-scams{ display:grid; gap:12px; max-width:760px; margin:0 auto 22px; }
  .vx-scam{ background:var(--panel-2); border:1px solid var(--line); border-radius:4px; }
  .vx-scam summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:16px 18px;
    font-family:var(--head); font-size:15.5px; color:var(--paper);
  }
  .vx-scam summary::-webkit-details-marker{ display:none; }
  .vx-scam summary::after{ content:'+'; margin-inline-start:auto; color:var(--brass-bright); font-family:var(--mono); font-size:20px; }
  .vx-scam[open] summary::after{ content:'\2212'; }
  .vx-scam[open]{ border-color:var(--brass-dim); }
  .vx-scam-icon{ font-size:22px; flex-shrink:0; }
  .vx-scam-body{ padding:2px 18px 18px; font-size:14.5px; line-height:1.9; color:var(--text); }
  .vx-scam-body p{ margin-bottom:10px; }
  .vx-scam-body strong{ color:var(--brass-bright); }
  .vx-rec{ padding:12px 14px; margin-bottom:10px; background:var(--ink); border-inline-start:3px solid var(--brass); font-size:14px; line-height:1.8; }
  .vx-rec .btn{ margin-top:8px; padding:6px 14px; font-size:13px; }
  .vx-safety-bar{ height:14px; background:var(--ink); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin:14px 0; }
  .vx-safety-bar div{ height:100%; background:var(--brass); transition:width .6s; }

  /* ---------- VISUAL RED-FLAGS GALLERY ---------- */
  .rf-mockup{
    max-width:640px; margin:0 auto 28px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; overflow:hidden;
  }
  .rf-mail-header{ padding:20px 22px; border-bottom:1px solid var(--line); background:var(--ink); }
  .rf-mail-row{ font-size:13.5px; color:var(--text); margin-bottom:8px; line-height:1.9; }
  .rf-mail-row:last-child{ margin-bottom:0; }
  .rf-mail-label{ color:var(--muted); font-family:var(--mono); font-size:11.5px; margin-inline-end:8px; }
  .rf-mail-value{ direction:rtl; }
  .rf-mail-body{ padding:24px 22px; }
  .rf-mail-body p{ color:var(--text); font-size:14.5px; line-height:1.9; margin-bottom:16px; }
  .rf-btn-row{ display:flex; align-items:center; gap:12px; margin-top:6px; }
  .rf-fake-btn{
    display:inline-block; background:var(--brass-dim); color:#fff; padding:10px 22px; border-radius:4px;
    font-size:14px; font-weight:700; text-decoration:none; cursor:default;
  }
  .rf-flag{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%;
    background:#ef4444; color:#fff; font-family:var(--mono); font-size:12px; font-weight:700; cursor:pointer;
    flex-shrink:0; transition:.2s; vertical-align:middle;
  }
  .rf-flag:hover{ transform:scale(1.15); }
  .rf-flag.active{ background:var(--brass-bright); color:var(--ink-fixed); }
  .rf-explanations{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .rf-exp{
    background:var(--panel); border:1px solid var(--line); border-inline-start:3px solid var(--line);
    padding:14px 16px; font-size:14px; color:var(--muted); line-height:1.7; border-radius:3px; transition:.25s;
  }
  .rf-exp strong{ color:var(--text); display:block; margin-bottom:4px; }
  .rf-exp.active{ border-inline-start-color:var(--brass); background:rgba(154,82,255,0.06); color:var(--text); }

  /* ---------- WHAT-IF HACKED CALCULATOR ---------- */
  .wi-field{ margin-bottom:20px; }
  .wi-field label{ display:block; font-size:13.5px; color:var(--muted); margin-bottom:8px; }
  .wi-input{
    width:100%; height:46px; background:var(--ink); border:1px solid var(--line); border-radius:4px;
    padding:0 16px; color:var(--paper); font-family:var(--mono); font-size:15px; outline:none; transition:.25s;
  }
  .wi-input:focus{ border-color:var(--brass); }
  .wi-toggles{ display:grid; gap:12px; margin-bottom:24px; }
  .wi-toggle{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text); cursor:pointer; }
  .wi-toggle input{ width:17px; height:17px; accent-color:var(--brass); cursor:pointer; flex-shrink:0; }
  .wi-result{ border-top:1px solid var(--line); padding-top:22px; }
  .wi-gauge{ height:10px; background:var(--line); border-radius:5px; overflow:hidden; margin-bottom:14px; }
  .wi-gauge-fill{ height:100%; width:0%; background:var(--line); transition:width .4s ease, background .4s ease; }
  .wi-verdict{ font-family:var(--head); font-size:17px; color:var(--paper); margin-bottom:8px; font-weight:700; }
  .wi-range{ font-family:var(--mono); font-size:13.5px; color:var(--muted); }

  /* ---------- HACKER-VIEW SIMULATION ---------- */
  .hv-panel{ max-width:820px; margin:0 auto; border:1px solid #4a1a1a; background:#140808; border-radius:4px; overflow:hidden; }
  .hv-topbar{
    background:#2a0d0d; color:#ff8080; font-family:var(--mono); font-size:12.5px; padding:12px 18px;
    border-bottom:1px solid #4a1a1a; display:flex; align-items:center; gap:10px;
  }
  .hv-dot{ width:8px; height:8px; border-radius:50%; background:#ff4d4d; display:inline-block; animation:hvBlink 1.4s ease-in-out infinite; flex-shrink:0; }
  @keyframes hvBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  .hv-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:#2a0d0d; }
  @media (max-width:760px){ .hv-grid{ grid-template-columns:repeat(2,1fr); } }
  .hv-card{ background:#180a0a; padding:24px 18px; cursor:pointer; transition:.2s; text-align:center; }
  .hv-card:hover{ background:#230c0c; }
  .hv-card.active{ background:#2d0e0e; box-shadow:inset 0 0 0 1px #ff4d4d; }
  .hv-icon{ font-size:28px; margin-bottom:10px; }
  .hv-card h4{ font-family:var(--head); font-size:14.5px; color:#ffb3b3; margin-bottom:6px; }
  .hv-card p{ font-size:12px; color:#a86b6b; line-height:1.6; }
  .hv-explanations{ padding:20px 18px; display:flex; flex-direction:column; gap:10px; }
  .hv-exp{
    display:none; background:#1c0a0a; border-inline-start:3px solid #ff4d4d; padding:14px 16px;
    font-size:14px; color:#d9a3a3; line-height:1.7; border-radius:3px;
  }
  .hv-exp.active{ display:block; }

  /* ---------- LIQUID GLASS CARDS (applies across lessons / tools / glossary / threats) ---------- */
  .lesson-block, .tool-card, .glossary-item, .threat, .resource-card{
    background:var(--glass-bg) !important;
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid var(--glass-border) !important;
    box-shadow:var(--glass-shadow), 0 0 16px rgba(154,82,255,0.10), 0 0 30px rgba(61,139,255,0.08);
    transition:box-shadow .3s ease, transform .3s ease, border-color .3s ease;
  }
  .tool-card{ background:var(--glass-bg-2) !important; }
  .lesson-block:hover, .tool-card:hover, .glossary-item:hover, .threat:hover, .resource-card:hover{
    border-color:rgba(154,82,255,0.35) !important;
    box-shadow:var(--glass-shadow), 0 0 22px rgba(154,82,255,0.22), 0 0 44px rgba(61,139,255,0.16);
  }
  .dock-options, .dock-more{
    box-shadow:0 12px 34px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.25),
               0 0 18px rgba(154,82,255,0.15), 0 0 34px rgba(61,139,255,0.12);
  }
  /* ---------- SECURITY TIPS TICKER ---------- */
  #tips-ticker{
    background:var(--panel); border-bottom:1px solid var(--line);
    overflow:hidden; white-space:nowrap; position:relative;
    display:flex; align-items:center; height:36px;
  }
  #tips-ticker .ticker-label{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    padding:0 14px; font-family:var(--mono); font-size:11px; color:var(--brass);
    border-inline-end:1px solid var(--line); white-space:nowrap; z-index:2;
    background:var(--panel); height:100%;
  }
  #tips-ticker .ticker-track-wrap{
    overflow:hidden; flex:1; height:100%; display:flex; align-items:center;
    mask-image:linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent);
    -webkit-mask-image:linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent);
  }
  #tips-ticker .ticker-track{
    display:inline-flex; gap:40px; white-space:nowrap;
    animation:tickerScroll 55s linear infinite; will-change:transform;
    padding-inline-start:40px;
  }
  #tips-ticker:hover .ticker-track{ animation-play-state:paused; }
  #tips-ticker .tip-item{
    font-size:12px; color:var(--text); white-space:nowrap;
    display:inline-flex; align-items:center; gap:7px;
  }
  #tips-ticker .tip-item::before{ content:'•'; color:var(--rust); flex-shrink:0; }
  @keyframes tickerScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  @media (max-width:640px){
    #tips-ticker .ticker-label{ padding:0 10px; font-size:10px; }
    #tips-ticker .tip-item{ font-size:11.5px; }
  }

  /* ---------- DAILY CHALLENGE BAR ---------- */
  .daily-challenge-bar{
    background:var(--glass-bg);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-bottom:1px solid var(--line); padding:10px 0;
  }
  .daily-challenge-inner{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .daily-label{ font-family:var(--mono); font-size:11.5px; color:var(--rust); flex-shrink:0; }
  .daily-host{ flex:1; display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:200px; }
  .daily-url{ font-family:var(--mono); font-size:12.5px; color:var(--paper); direction:ltr; text-align:start; word-break:break-all; margin:0; }
  .daily-actions{ display:flex; gap:8px; flex-shrink:0; }
  .daily-actions .btn{ padding:7px 16px; font-size:13px; }
  .daily-result{ display:flex; flex-direction:column; gap:4px; width:100%; }
  .daily-result p{ margin:0; font-size:12.5px; color:var(--muted); line-height:1.6; }
  .daily-status{ font-size:12.5px; }
  .daily-result.correct .daily-status{ color:var(--brass-bright); font-weight:700; }
  .daily-result.wrong .daily-status{ color:#ff6b6b; font-weight:700; }
  .daily-share-row{ margin-top:2px; }
  @media (max-width:640px){
    .daily-challenge-inner{ flex-direction:column; align-items:flex-start; gap:8px; }
    .daily-host{ width:100%; }
  }

  /* ---------- INCOMING CHALLENGE BANNER ---------- */
  .incoming-challenge-bar{
    position:fixed; top:0; left:0; right:0; z-index:9999;
    background:linear-gradient(90deg, var(--brass), var(--rust));
    padding:10px 16px; box-shadow:0 2px 16px rgba(0,0,0,0.35);
  }
  .incoming-challenge-inner{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; max-width:960px; margin:0 auto; }
  .incoming-challenge-text{ font-size:13.5px; font-weight:700; color:var(--ink-fixed); }
  .incoming-challenge-bar .btn-primary{ background:var(--ink-fixed); color:var(--brass-bright); padding:6px 16px; font-size:13px; border:none; }
  .incoming-challenge-close{ background:transparent; border:none; color:var(--ink-fixed); font-size:17px; cursor:pointer; padding:2px 8px; line-height:1; opacity:.75; }
  .incoming-challenge-close:hover{ opacity:1; }
  @media (max-width:640px){
    .incoming-challenge-text{ font-size:12.5px; }
  }

  /* ---------- QUIZ / SIM RESULT ACTIONS ---------- */
  .quiz-result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px; }

  /* ---------- LEARNING TRACK TABS ---------- */
  .track-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 26px; }
  .track-tab{
    display:flex; align-items:center; gap:7px; padding:8px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    font-size:13.5px; font-family:inherit; cursor:pointer; transition:border-color .2s, color .2s, background .2s;
  }
  .track-tab:hover{ border-color:var(--brass); color:var(--text); }
  .track-tab.active{
    background:linear-gradient(90deg, var(--brass), var(--rust)); color:var(--ink-fixed);
    border-color:transparent; font-weight:700;
  }
  .track-count{
    font-family:var(--mono); font-size:11px; opacity:.9; background:rgba(255,255,255,0.12);
    padding:1px 8px; border-radius:999px; min-width:28px; text-align:center;
  }
  .track-tab.active .track-count{ background:rgba(0,0,0,0.2); }
  @media (max-width:640px){
    .track-tabs{ flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; margin-bottom:22px; }
    .track-tab{ flex-shrink:0; }
  }

  /* ---------- MINI CTF (hidden flags) ---------- */
  .ctf-box{
    max-width:620px; margin:0 auto; border-radius:14px; padding:26px 24px;
    background:var(--glass-bg); border:1px solid var(--glass-border);
    backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
  }
  .ctf-flags-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .ctf-flag-item{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.04); font-size:13px; color:var(--muted); }

  /* ---------- NEON AMBIENT ORBS (hero backdrop) ---------- */
  .hero{ position:relative; overflow:hidden; }
  .hero::before, .hero::after{
    content:''; position:absolute; border-radius:50%; filter:blur(70px); opacity:.35;
    pointer-events:none; z-index:0; animation:neonFloat 9s ease-in-out infinite alternate;
  }
  .hero::before{ width:280px; height:280px; background:var(--brass); top:-60px; inset-inline-start:-60px; }
  .hero::after{ width:320px; height:320px; background:var(--rust); bottom:-80px; inset-inline-end:-60px; animation-delay:-4.5s; }
  .hero .wrap{ position:relative; z-index:1; }
  @keyframes neonFloat{ 0%{ transform:translateY(0) scale(1); } 100%{ transform:translateY(-26px) scale(1.12); } }
  :root[data-theme="light"] .hero::before, :root[data-theme="light"] .hero::after{ opacity:.18; }

  /* ---------- LIQUID BACKGROUND BLOBS (site-wide) ---------- */
  .liquid-bg{
    position:fixed; inset:0; z-index:-2; overflow:hidden; pointer-events:none;
  }
  .liquid-bg .lb{
    position:absolute; border-radius:50%; filter:blur(100px); opacity:.16;
  }
  .liquid-bg .lb1{
    width:480px; height:480px; background:var(--brass); top:-120px; inset-inline-start:-100px;
    animation:lbDrift1 26s ease-in-out infinite alternate;
  }
  .liquid-bg .lb2{
    width:520px; height:520px; background:var(--rust); bottom:-160px; inset-inline-end:-120px;
    animation:lbDrift2 32s ease-in-out infinite alternate;
  }
  .liquid-bg .lb3{
    width:380px; height:380px; background:#2f7bf0; top:45%; inset-inline-start:40%;
    opacity:.10;
    animation:lbDrift3 38s ease-in-out infinite alternate;
  }
  @keyframes lbDrift1{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(60px,80px) scale(1.15); } }
  @keyframes lbDrift2{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(-70px,-60px) scale(1.1); } }
  @keyframes lbDrift3{ 0%{ transform:translate(-40px,-30px) scale(.9); } 100%{ transform:translate(50px,40px) scale(1.2); } }
  #sparkle-canvas{ position:fixed; inset:0; z-index:-1; pointer-events:none; }

  /* ---------- SHINE / GLOW UTILITIES ---------- */
  .shine-text{
    background:linear-gradient(90deg, var(--brass) 0%, var(--rust-bright) 25%, var(--brass-bright) 50%, var(--rust) 75%, var(--brass) 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:var(--brass);
    animation:shineMove 6s linear infinite;
  }
  @keyframes shineMove{ to{ background-position:-200% center; } }

  .glow-cta{
    position:relative; display:inline-block; border-radius:14px; padding:2.5px;

  @keyframes glowShift{ 0%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } 100%{ background-position:0% 50%; } }

  @media (prefers-reduced-motion: reduce){

<section id="lessons">
  <div class="wrap">
    <div class="section-head">
      <h2>تعمّق أكثر: الهاتف تحديدًا</h2>
      <p>الأمن السيبراني لا يقتصر على الهاتف فقط. أربعة عشر درسًا مركّزة تغطي الصورة الكاملة، من اختراق الأجهزة إلى الاحتيال المالي وأمان الشبكة المنزلية.</p>
    </div>

    <div class="track-tabs" data-scope="lessons">
      <button type="button" class="track-tab" onclick="trackFilter('lessons','all')">الكل <span class="track-count" id="track-count-lessons-all"></span></button>
      <button type="button" class="track-tab" onclick="trackFilter('lessons','beginner')">🟢 مبتدئ <span class="track-count" id="track-count-lessons-beginner"></span></button>

      <button type="button" class="track-tab" onclick="trackFilter('lessons','advanced')">🔴 متقدم <span class="track-count" id="track-count-lessons-advanced"></span></button>
    </div>

    <div class="lessons-list">
      <details class="lesson-block" id="lesson-01" data-level="intermediate" open>
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li1" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><rect x="9" y="3" width="14" height="26" rx="2.5" stroke="url(#li1)" stroke-width="1.8"/><line x1="9" y1="8" x2="23" y2="8" stroke="url(#li1)" stroke-width="1.4"/><line x1="9" y1="24" x2="23" y2="24" stroke="url(#li1)" stroke-width="1.4"/><line x1="16" y1="14" x2="16" y2="20" stroke="#3d8bff" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="23" r="1.1" fill="#3d8bff"/></svg></span>
          <span class="lesson-num">01</span>
          <span class="lesson-title">كيف تُخترق الهواتف؟ نظرة عامة على الطرق الشائعة</span>
          <span class="quiz-score-badge" id="qbadge-lesson-01"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>أغلب طرق اختراق الهواتف لا تحتاج مهارة تقنية عالية من المهاجم بقدر ما تحتاج منك خطوة واحدة خاطئة. إليك كيف يحدث ذلك فعليًا:</p>

          <p><strong>تخيل هذا المشهد:</strong> تفتح واتساب فتجد رسالة من "شركة الشحن" تقول إن طردك بانتظار رسوم بسيطة، مع رابط دفع. الرابط يشبه الموقع الأصلي تمامًا، فتضغطه بدون تفكير وتدخل بيانات بطاقتك. خلال دقائق، تُستنزف بطاقتك بالكامل من مشترٍ آخر. هذا بالضبط تصيّد احتيالي عبر الرسائل، وهو أشهر طريقة يقع بها الناس ضحايا، لأنه يستغل لحظة استعجال بسيطة.</p>

          <p><strong>أو تخيل موقفًا آخر:</strong> تبحث عن نسخة مجانية من لعبة مدفوعة، فتجد تطبيقًا يعد بذلك خارج المتجر الرسمي. تثبّته، ويطلب صلاحيات غريبة تتجاهلها لأنك متحمس للعبة. بعد أسبوع، تلاحظ رسائل غريبة تُرسل من حسابك دون علمك — التطبيق كان يعمل بصمت بالخلفية، يقرأ رسائلك ويتحكم بجهازك.</p>

          <p><strong>أو تجلس بمقهى</strong>، تتصل بشبكة واي فاي اسمها يشبه اسم المقهى بالضبط، وتدخل لحسابك البنكي لتتأكد من رصيدك. بدون ما تدري، هذي الشبكة مزيفة أنشأها شخص يجلس على الطاولة المجاورة، وهو الآن يرى كل شيء تكتبه.</p>

          <p><strong>أو يتصل بك شخص</strong> يدّعي إنه موظف من شركة الاتصالات، ويسألك عن بعض بياناتك "للتحقق من الهوية" — تاريخ ميلادك، آخر أرقام من بطاقتك. تجاوب بدون شك لأنه يبدو رسميًا. بعد ساعات، ينقطع خط هاتفك فجأة؛ يكون قد نقل رقمك لشريحة بحوزته، وبدأ يستقبل رموز التحقق من حساباتك واحدًا تلو الآخر.</p>

          <div class="callout warn">
            <strong>لاحظ القاسم المشترك:</strong> كل هذي المواقف استغلت لحظة عادية — استعجال، حماس، أو ثقة. ما فيه ذكاء خارق من المهاجم بقدر ما فيه استغلال لحظة غفلة منك. وهذا بالضبط سبب أهمية الدروس القادمة.
          </div>

          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('lesson-01', this)">📝 اختبر فهمك في هذا الدرس</button>

      <details class="lesson-block" id="lesson-02" data-level="beginner">

          <span class="lesson-num">02</span>
          <span class="lesson-title">خطوات عملية لحماية هاتفك من الاختراق</span>
          <span class="quiz-score-badge" id="qbadge-lesson-02"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>قائمة تقدر تطبّقها اليوم في أقل من نصف ساعة:</p>
          <ul>
            <li>فعّل قفل شاشة قوي (6 أرقام على الأقل) مع بصمة أو وجه كطبقة إضافية.</li>
            <li>فعّل خاصية تحديد الموقع عند الفقدان (Find My iPhone / Find My Device).</li>
            <li>ثبّت تحديثات النظام فور توفرها، ولا تؤجلها لأكثر من بضعة أيام.</li>
            <li>راجع صلاحيات التطبيقات مرة شهريًا، واحذف ما لا تستخدمه.</li>
            <li>لا تفتح روابط من أرقام مجهولة عبر الرسائل مهما بدت عاجلة.</li>
            <li>استخدم بيانات الهاتف بدل واي فاي عام عند الدخول لحسابات حساسة.</li>
            <li>فعّل التوثيق الثنائي عبر تطبيق مصادقة (لا رسائل SMS) على بريدك وحساباتك المهمة.</li>
          </ul>

      <details class="lesson-block" id="lesson-03" data-level="intermediate">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li3" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M6 14 a15 15 0 0 1 20 0" stroke="url(#li3)" stroke-width="1.8" stroke-linecap="round"/><path d="M10 19 a9 9 0 0 1 12 0" stroke="url(#li3)" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="24" r="1.6" fill="#3d8bff"/><rect x="21" y="4" width="8" height="11" rx="1.5" stroke="#3d8bff" stroke-width="1.4"/><line x1="23" y1="7" x2="27" y2="7" stroke="#3d8bff" stroke-width="1.1"/></svg></span>

          <span class="lesson-title">التطبيقات الخبيثة وصلاحيات مشبوهة</span>

          <span class="lesson-toggle">+</span>

        <div class="lesson-body">
          <p>ليست كل التطبيقات الخطيرة من مصادر مجهولة، بعضها موجود بالمتاجر الرسمية نفسها. علامات تستحق الانتباه:</p>
          <ul>
            <li>يطلب صلاحيات لا علاقة لها بوظيفته، مثل تطبيق فلاش لايت يطلب الوصول لجهات الاتصال والمايكروفون.</li>
            <li>عدد التحميلات منخفض جدًا مقابل تقييمات إيجابية كثيرة بشكل غير طبيعي، أو اسم مطوّر مجهول تمامًا.</li>
            <li>يطلب منك تعطيل ميزة حماية بالنظام لكي "يعمل بشكل صحيح".</li>
            <li>يعد بميزات مدفوعة مجانًا لتطبيقات أو ألعاب معروفة، وهذا أشهر فخ على الإطلاق.</li>
            <li>راجع صلاحيات تطبيقاتك مرة كل شهر، واسحب أي صلاحية غير ضرورية لا تخدم وظيفة التطبيق الفعلية.</li>
          </ul>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('lesson-03', this)">📝 اختبر فهمك في هذا الدرس</button>

        <summary>

          <span class="lesson-num">04</span>
          <span class="lesson-title">أساسيات كلمات المرور القوية</span>
          <span class="quiz-score-badge" id="qbadge-lesson-04"></span>

        <div class="lesson-body">
          <p>كلمة المرور أول باب في أي حساب، وهذه القواعد تحدد إذا كان بابًا قويًا أو مجرد شكل:</p>
          <ul>
            <li>الطول أهم من التعقيد؛ عبارة مرور من كلمات عشوائية غير مترابطة أسهل للتذكر وأصعب للتخمين من كلمة قصيرة معقدة.</li>
            <li>إعادة استخدام نفس كلمة المرور بعدة مواقع تعني أن تسرّب موقع واحد يكشف كل حساباتك الأخرى.</li>
            <li>مدير كلمات المرور ينشئ ويحفظ كلمة فريدة لكل موقع، وكل ما تحتاج تذكّره كلمة رئيسية واحدة.</li>
            <li>التوثيق الثنائي عبر تطبيق مصادقة أقوى من الرسائل النصية، لأنه غير مرتبط برقم هاتفك وبالتالي غير معرّض لهجوم تبديل الشريحة.</li>
          </ul>
