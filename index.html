      <details class="lesson-block" id="lesson-05" data-level="beginner">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li5" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M16 3 L28 8 V16 C28 23 23 28 16 30 C9 28 4 23 4 16 V8 Z" stroke="url(#li5)" stroke-width="1.8"/><circle cx="16" cy="15" r="2.4" fill="#3d8bff"/></svg></span>
          <span class="lesson-num">05</span>
          <span class="lesson-title">ما هو الأمن السيبراني ولماذا يهمك؟</span>
          <span class="quiz-score-badge" id="qbadge-lesson-05"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>قبل ما تتعمق أكثر، من المفيد تفهم الصورة الكاملة:</p>
          <ul>
            <li>الأمن السيبراني هو مجموعة الممارسات اللي تحمي أجهزتك وبياناتك وحساباتك من الوصول أو الاستخدام غير المصرّح به.</li>
            <li>ما هو حكرًا على الشركات الكبيرة أو المبرمجين؛ أي شخص يملك بريدًا إلكترونيًا أو حسابًا بنكيًا هو هدف محتمل.</li>
            <li>أغلب الاختراقات لا تستهدفك أنت شخصيًا، بل تُشن بشكل آلي وواسع على آلاف الأشخاص دفعة واحدة، وتنجح مع أول شخص يخطئ.</li>
            <li>الحماية الحقيقية مبنية على طبقات متتالية (الوعي، الحسابات، الجهاز، الشبكة، البيانات) لا أداة واحدة سحرية — وهذا بالضبط ما تغطيه الصفحة الرئيسية لهذا الموقع.</li>
            <li>التعلم المستمر هو الطبقة الأهم؛ التهديدات تتطور باستمرار، والوعي بها هو أول خط دفاع يتجدد معها.</li>
          </ul>

      <details class="lesson-block" id="lesson-06" data-level="beginner">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li6" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><rect x="4" y="8" width="24" height="17" rx="1.5" stroke="url(#li6)" stroke-width="1.8"/><path d="M4 9 L16 19 L28 9" stroke="url(#li6)" stroke-width="1.8" fill="none"/><path d="M20 20 C24 20 26 23 25 26 C24.5 28 21.5 28 21.5 26" stroke="#3d8bff" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></span>
          <span class="lesson-num">06</span>
          <span class="lesson-title">كيف تكتشف رسائل التصيد الاحتيالي</span>
          <span class="quiz-score-badge" id="qbadge-lesson-06"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>التصيّد الاحتيالي (Phishing) هو نقطة البداية لأغلب الاختراقات، وأغلب الناس ما يتخيلون نفسهم "يقعون في الفخ" بهذي السهولة. إليك كيف يحدث فعليًا:</p>

          <p><strong>الساعة تسعة مساءً</strong>، تصلك رسالة إيميل من "بنكك" تقول إن فيه محاولة دخول مشبوهة على حسابك، ولازم تأكد هويتك فورًا وإلا يُجمّد الحساب. أنت متعب، والرسالة فيها شعار البنك بالضبط ونفس الألوان. تضغط الرابط بدون تفكير — الموقع اللي يفتح يشبه موقع بنكك حرفيًا، فتدخل رقم حسابك وكلمة المرور. بعد دقائق، تكتشف إن حسابك فُرغ فعليًا.</p>

          <p>المشكلة إن الرسالة كانت مزيفة من الأساس، والرابط يوديك لصفحة مطابقة شكليًا لكنها بيد المهاجم. لو رجعت تدقق، كان بتلاحظ إن رابط الموقع فيه حرف زايد أو نطاق غريب (bank-secure.com بدل bankname.com مثلًا) — لكن ما فيه وقت للتدقيق وأنت بحالة قلق.</p>

          <p>هذا بالضبط أسلوب التصيّد: يخلق إحساسًا بالإلحاح (تهديد بإغلاق حساب، طرد بانتظار الدفع، جائزة تنتظرك) عشان يمنعك تفكر بهدوء قبل ما تتصرف. العلامات تتكرر دائمًا: رابط أو نطاق غريب، طلب معلومات حساسة مباشرة، أخطاء إملائية أو صياغة غير طبيعية، وعرض مبالغ فيه ما تستحقه.</p>

          <div class="callout">
            <strong>عند الشك:</strong> لا تضغط الرابط مهما بدا عاجلًا. تواصل مع الجهة عبر قناتها الرسمية المعروفة مسبقًا (لا عبر أي رقم أو رابط مذكور بالرسالة نفسها)، وأبلغ عنها كاحتيال.
          </div>

      <details class="lesson-block" id="lesson-07" data-level="advanced">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li7" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><rect x="4" y="13" width="24" height="14" rx="2" stroke="url(#li7)" stroke-width="1.8"/><path d="M11 13 V9 a3 3 0 0 1 3-3 h4 a3 3 0 0 1 3 3 v4" stroke="url(#li7)" stroke-width="1.8" fill="none"/><line x1="4" y1="19" x2="28" y2="19" stroke="#3d8bff" stroke-width="1.4"/><line x1="16" y1="17" x2="16" y2="21.5" stroke="#3d8bff" stroke-width="1.4"/></svg></span>
          <span class="lesson-num">07</span>
          <span class="lesson-title">أشهر أدوات الاختراق: نظرة تعريفية</span>
          <span class="quiz-score-badge" id="qbadge-lesson-07"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>هذا الدرس تعريفي بحت — الهدف إنك تفهم <strong>لماذا</strong> ننصحك بإجراءات معينة، لا كيفية استخدام أي أداة. معرفة فئات الأدوات اللي يعتمد عليها المهاجمون تخليك تفهم منطق الحماية بدل ما تحفظه حفظ.</p>
          <ul>
            <li><strong>أدوات فحص الشبكات</strong> — تكشف الأجهزة والمنافذ المفتوحة على شبكة معينة. لهذا تحديث جهاز الراوتر وإغلاق المنافذ غير المستخدمة يقلل نقاط الدخول المحتملة.</li>
            <li><strong>أدوات التقاط حزم البيانات</strong> — تراقب البيانات المتنقلة عبر شبكة غير مشفّرة. لهذا بالضبط شبكات الواي فاي العامة خطيرة (راجع الدرس الثالث)، ولماذا HTTPS مهم عند تصفحك.</li>
            <li><strong>أدوات كسر كلمات المرور</strong> — تجرّب آلاف أو ملايين الاحتمالات بسرعة عالية. لهذا الطول والتفرّد بكلمة المرور (الدرس الرابع) يصنعان فرقًا حقيقيًا، لا مجرد نصيحة شكلية.</li>
            <li><strong>أطر استغلال الثغرات</strong> — تجمّع ثغرات معروفة بأنظمة غير محدَّثة وتستغلها آليًا. لهذا كل تحديث نظام تؤجله هو نافذة زمنية إضافية مفتوحة للاستغلال.</li>
            <li><strong>قوالب صفحات التصيّد</strong> — نسخ جاهزة لصفحات دخول مزيفة (بنوك، بريد إلكتروني) يخصّصها المهاجم بسرعة. لهذا التدقيق بالرابط قبل إدخال بياناتك (الدرس السادس) خطوة لا يمكن تجاوزها.</li>
          </ul>
          <div class="callout">
            <strong>الفكرة الأساسية:</strong> كل أداة بالقائمة لها إجراء دفاعي مقابل تعلمته بدرس سابق. الأدوات تتطور، لكن مبادئ الحماية الأساسية تبقى فعّالة ضدها.
          </div>

      <details class="lesson-block" id="lesson-08" data-level="advanced">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li8" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M16 3 L28 8 V16 C28 23 23 28 16 30 C9 28 4 23 4 16 V8 Z" stroke="url(#li8)" stroke-width="1.8"/><path d="M11 16 L14.5 19.5 L21 12.5" stroke="#3d8bff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="lesson-num">08</span>
          <span class="lesson-title">أدوات الحماية المقابلة: كيف يدافع المحترفون</span>
          <span class="quiz-score-badge" id="qbadge-lesson-08"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>بنفس طريقة الدرس السابق، هذي فئات الأدوات اللي يعتمد عليها المدافعون — أدوات تقدر تستخدمها أنت شخصيًا، لا مختصين فقط:</p>
          <ul>
            <li><strong>مدير كلمات المرور</strong> — ينشئ ويحفظ كلمة فريدة ومعقّدة لكل حساب تلقائيًا (تفصيل كامل بالدرس الرابع).</li>
            <li><strong>تطبيقات التوثيق الثنائي</strong> — تولّد رمز دخول مؤقت غير مرتبط برقم هاتفك، مما يوقف أغلب محاولات الدخول حتى لو سُرقت كلمة مرورك.</li>
            <li><strong>برامج مكافحة الفيروسات وجدار الحماية</strong> — يراقبان النشاط المشبوه على جهازك ويمنعان الاتصالات غير الموثوقة تلقائيًا.</li>
            <li><strong>VPN موثوق</strong> — يشفّر اتصالك بالكامل، مفيد خصوصًا عند الاضطرار لاستخدام واي فاي عام.</li>
            <li><strong>أدوات النسخ الاحتياطي التلقائي</strong> — تحفظ نسخة من بياناتك بمكان منفصل، فتبقى بمأمن حتى لو تعرّض جهازك للفدية أو التلف.</li>
          </ul>
          <div class="callout">
            <strong>خلاصة الدروس الثمانية:</strong> لاحظ إن كل أداة حماية هنا تقابل مباشرة أحد أدوات الاختراق بالدرس السابق. الأمان الحقيقي مو معرفة كل شيء، بل تطبيق الأساسيات باستمرار.
          </div>

      <details class="lesson-block" id="lesson-09" data-level="advanced">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li9" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><circle cx="16" cy="14" r="10" stroke="url(#li9)" stroke-width="1.8"/><path d="M16 9 v10 M13 11.3 c0-1.5 1.5-2.3 3-2.3s3 .9 3 2.3-1.5 1.9-3 2.4-3 .9-3 2.4 1.5 2.3 3 2.3 3-.8 3-2.3" stroke="#3d8bff" stroke-width="1.3" stroke-linecap="round" fill="none"/><path d="M6 27 l5-4 4 2 6-6 5 3" stroke="#3d8bff" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></span>
          <span class="lesson-num">09</span>
          <span class="lesson-title">الاحتيال المالي: العملات المشفرة والاستثمار الوهمي</span>
          <span class="quiz-score-badge" id="qbadge-lesson-09"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>الاحتيال المالي الرقمي يتطور بسرعة، وأحدث أشكاله يستغل كلمات مثل "عملات مشفرة" و"استثمار بالذكاء الاصطناعي" لإعطاء انطباع بالحداثة والموثوقية. إليك كيف يحدث فعليًا:</p>

          <p><strong>تخيل هذا المشهد:</strong> ترى منشورًا على فيسبوك أو إنستغرام لشخص يبدو "خبيرًا ماليًا" يعرض لقطات شاشة لأرباح ضخمة من تداول العملات المشفرة، ويدعوك لمجموعة واتساب مغلقة "للمتابعين الجادين فقط". تدخل المجموعة، فتجد عشرات الرسائل من أشخاص آخرين (حسابات مزيفة غالبًا) يشكرون "الخبير" على الأرباح. يطلب منك إيداع مبلغ صغير في البداية على منصة تداول "رسمية المظهر". بعد أيام، يظهر رصيدك وكأنه تضاعف.</p>

          <p>يتحمّسون منك ويقترحون إيداع مبالغ أكبر لتحقيق أرباح أكبر. بعد أن تودّع مبلغًا أكبر، تحاول السحب — فتُفاجأ بطلب "رسوم تفعيل" أو "ضريبة سحب" غير مذكورة من قبل. تدفعها، ثم يُطلب رسم آخر. وفي النهاية يُغلق الحساب أو يتوقف "الخبير" عن الرد تمامًا.</p>

          <div class="callout warn">
            <strong>علامات تحذيرية دائمة في أي عرض استثماري:</strong>
            <ul style="margin-top:10px;">
              <li>وعد بعائد ثابت أو مرتفع بشكل غير واقعي (أكثر من 10-20% شهريًا مثلاً).</li>
              <li>ضغط عاطفي عبر "مجموعات نجاح" مليئة بشهادات لا يمكن التحقق منها.</li>
              <li>طلب الإيداع عبر محفظة عملات مشفرة مباشرة أو تطبيق تحويل غير معروف، لا منصة مرخّصة رسميًا.</li>
              <li>أي "رسوم" أو "ضرائب" إضافية تظهر فقط عند محاولة السحب.</li>
              <li>الإصرار على السرية وعدم استشارة أي شخص آخر قبل الإيداع.</li>
            </ul>
          </div>

          <p><strong>القاعدة الذهبية:</strong> أي جهة تتحمس لإيداعك المال أكثر مما تتحمس أنت لربحه، هي علامة كافية للتوقف فورًا.</p>

      <details class="lesson-block" id="lesson-10" data-level="intermediate">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li10" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><rect x="5" y="20" width="22" height="7" rx="1.5" stroke="url(#li10)" stroke-width="1.8"/><circle cx="10" cy="23.5" r="1" fill="#3d8bff"/><circle cx="14" cy="23.5" r="1" fill="#3d8bff"/><path d="M12 16 a6 6 0 0 1 8 0" stroke="#3d8bff" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M9 12.5 a12 12 0 0 1 14 0" stroke="#3d8bff" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg></span>
          <span class="lesson-num">10</span>
          <span class="lesson-title">أمان الشبكة المنزلية والراوتر</span>
          <span class="quiz-score-badge" id="qbadge-lesson-10"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>الراوتر هو الباب الذي يمر عبره كل جهاز في منزلك للإنترنت — وإذا بقي بإعداداته الافتراضية، فهو أسهل نقطة اختراق للمنزل بالكامل. خطوات عملية لتأمينه:</p>
          <ul>
            <li>غيّر كلمة مرور الراوتر الافتراضية (مثل admin/admin) فور تركيبه — هذي أول شيء يجرّبه أي مخترق قريب من شبكتك.</li>
            <li>غيّر اسم الشبكة (SSID) الافتراضي الذي يكشف غالبًا طراز الراوتر أو مزود الخدمة، مما يسهّل استغلال ثغراته المعروفة.</li>
            <li>فعّل تشفير WPA3 إن كان متاحًا، أو WPA2 كحد أدنى — وتجنّب تمامًا بروتوكول WEP القديم غير الآمن.</li>
            <li>أنشئ شبكة ضيوف (Guest Network) منفصلة لأي زائر أو جهاز غير موثوق، بدل منحه دخولًا كاملًا لشبكتك الرئيسية.</li>
            <li>حدّث برنامج الراوتر (Firmware) بشكل دوري من إعدادات الراوتر نفسه — تحديثات الأمان تُغلق ثغرات مكتشفة حديثًا.</li>
            <li>أوقف ميزة "الوصول عن بُعد" (Remote Management) إن لم تكن تستخدمها فعليًا.</li>
            <li>راجع قائمة الأجهزة المتصلة بشبكتك من تطبيق الراوتر مرة شهريًا، وإذا وجدت جهازًا لا تعرفه، غيّر كلمة مرور الشبكة فورًا.</li>
          </ul>
          <div class="callout">
            <strong>لماذا هذا مهم؟</strong> لو اخترق شخص راوترك، يمكنه مراقبة كل بيانات غير مشفّرة تعبر شبكتك من كل أجهزتك دفعة واحدة — لا جهاز واحد فقط.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('lesson-10', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-lesson-10"></div>

      <details class="lesson-block" id="lesson-11" data-level="intermediate">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li11" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><rect x="3" y="7" width="26" height="8" rx="2" stroke="url(#li11)" stroke-width="1.8"/><circle cx="9" cy="11" r="1" fill="#3d8bff"/><circle cx="21" cy="22" r="6" stroke="#3d8bff" stroke-width="1.8"/><line x1="25.3" y1="26.3" x2="29" y2="30" stroke="#3d8bff" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <span class="lesson-num">11</span>
          <span class="lesson-title">تعلّم قراءة الرابط (URL) بعين الخبير</span>
          <span class="quiz-score-badge" id="qbadge-lesson-11"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>كل رابط (URL) مبني من أجزاء ثابتة، وفهمها يكفي لكشف أغلب الروابط المزيفة خلال ثوانٍ قليلة:</p>
          <ul>
            <li><strong>البروتوكول (https://):</strong> يعني أن الاتصال مشفّر فقط، ولا يعني أبدًا أن الموقع نفسه موثوق — مواقع التصيّد الحديثة تملك شهادات https صالحة أيضًا.</li>
            <li><strong>النطاق الحقيقي:</strong> هو الجزء الموجود مباشرة قبل اللاحقة (.com، .dz، .org...) وقبل أول "/" في الرابط. كل ما يسبقه مجرد نطاق فرعي يمكن لأي شخص كتابته بحرية.</li>
            <li><strong>المسار (بعد أول /):</strong> تفاصيل إضافية داخل الموقع، لا علاقة لها بتحديد هوية الموقع نفسه.</li>
          </ul>
          <div class="callout warn">
            <strong>مثال حقيقي يخدع الكثيرين:</strong><br>
            <code>https://paypal.com.secure-verify-login.ru/account</code><br>
            رغم ظهور كلمة "paypal.com" في بداية الرابط، فإن النطاق الحقيقي هنا هو <strong>secure-verify-login.ru</strong> — الموجود مباشرة قبل أول "/". كلمة "paypal.com" مجرد نطاق فرعي مزيّف اختاره المحتال عمدًا لخداع عينك.
          </div>
          <p>علامات أخرى تستحق الانتباه:</p>
          <ul>
            <li><strong>التبديل البصري (Typosquatting):</strong> نطاقات تشبه الأصلية بحرف واحد مختلف، مثل استبدال أصفار بدل حرف o في g00gle.com.</li>
            <li><strong>الروابط المختصرة:</strong> خدمات اختصار الروابط تخفي الوجهة الحقيقية تمامًا؛ لا تضغطها أبدًا دون التأكد من وجهتها أولًا.</li>
            <li><strong>الرابط الطويل جدًا المليء بأحرف وأرقام عشوائية:</strong> غالبًا محاولة لإخفاء نطاق مريب وسط تفاصيل كثيرة تشتت انتباهك.</li>
          </ul>
          <div class="callout">
            <strong>على الهاتف تحديدًا:</strong> اضغط مطولًا على أي رابط (دون فتحه) لمعاينة عنوانه الكامل قبل الدخول إليه فعليًا.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('lesson-11', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-lesson-11"></div>
          <button class="btn btn-ghost lesson-next" onclick="goToLesson('lesson-12')">التالي</button>
        </div>
      </details>

      <details class="lesson-block" id="lesson-12" data-level="beginner">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li12" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M16 3 L28 8 V16 C28 23 23 28 16 30 C9 28 4 23 4 16 V8 Z" stroke="url(#li12)" stroke-width="1.8"/><line x1="16" y1="11" x2="16" y2="18" stroke="#3d8bff" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="22" r="1.2" fill="#3d8bff"/></svg></span>
          <span class="lesson-num">12</span>
          <span class="lesson-title">علامات تدل أن موقعًا غير آمن (دليل المبتدئين)</span>
          <span class="quiz-score-badge" id="qbadge-lesson-12"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>لست بحاجة لتكون خبيرًا تقنيًا لتُلاحظ أن موقعًا غير آمن — هذه علامات بسيطة يكفي تدريب عينك عليها:</p>
          <p><strong>علامات عامة على أي موقع:</strong></p>
          <ul>
            <li>غياب القفل 🔒 بجانب الرابط، أو تحذير من المتصفح نفسه بأن الاتصال غير آمن.</li>
            <li>أخطاء إملائية ولغوية متكررة، أو تصميم غير احترافي يتناقض مع حجم الجهة التي يدّعيها.</li>
            <li>غياب تام لأي معلومات تواصل حقيقية، أو سياسة خصوصية، أو شروط استخدام.</li>
            <li>لغة إلحاح مصطنعة ("العرض ينتهي خلال دقائق!") تدفعك لاتخاذ قرار سريع دون تفكير.</li>
            <li>طلب معلومات لا علاقة لها بالخدمة المقدَّمة، مثل طلب رقم بطاقتك الكامل ورمز الأمان لمجرد "التسجيل" في موقع لا يبيع شيئًا.</li>
          </ul>
          <p><strong>علامات إضافية خاصة بالمواقع المالية والبنكية:</strong></p>
          <ul>
            <li>لا يطلب أي بنك حقيقي رمز التحقق أو كلمة المرور أو الرقم السري كاملًا عبر الهاتف أو البريد أو الموقع مباشرة — طلب هذا بحد ذاته علامة احتيال مؤكدة.</li>
            <li>تحقق من النطاق الرسمي للبنك بكتابته يدويًا في المتصفح أو عبر بحث مستقل، لا عبر رابط وصلك برسالة أو إعلان.</li>
            <li>ابحث عن ترخيص الجهة المالية أو رقم تسجيلها الرسمي، غالبًا مذكور بأسفل الصفحة الرئيسية لأي مؤسسة مالية حقيقية.</li>
            <li>تطبيقات البنوك الرسمية موجودة فقط على متجر التطبيقات الرسمي باسم الجهة الصحيح وعدد تحميلات كبير ومراجعات حقيقية — احذر من نسخ مقلّدة بنفس الاسم تقريبًا.</li>
          </ul>
          <div class="callout">
            <strong>القاعدة الذهبية:</strong> عند الشك، لا تدخل أي بيانات. أغلق الصفحة، وابحث عن الجهة بنفسك من مصدر تعرفه مسبقًا بدل الثقة بأي رابط وصلك.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('lesson-12', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-lesson-12"></div>
          <button class="btn btn-ghost lesson-next" onclick="goToLesson('lesson-13')">التالي</button>
        </div>
      </details>

      <details class="lesson-block" id="lesson-13" data-level="beginner">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li13" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M5 6h22v15H15l-6 5v-5H5z" stroke="url(#li13)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="11" cy="13.5" r="1.4" fill="url(#li13)"/><circle cx="16" cy="13.5" r="1.4" fill="url(#li13)"/><circle cx="21" cy="13.5" r="1.4" fill="url(#li13)"/></svg></span>
          <span class="lesson-num">13</span>
          <span class="lesson-title">الهندسة الاجتماعية: حين يُخترق الإنسان قبل الجهاز</span>
          <span class="quiz-score-badge" id="qbadge-lesson-13"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>الهندسة الاجتماعية (Social Engineering) هي خداع الإنسان نفسه ليسلّم المهاجم ما يريد، بدل كسر الأجهزة. وهي أسهل عليه بكثير: لماذا يكسر قفلًا معقّدًا إن كان يستطيع إقناعك بفتح الباب بنفسك؟</p>
          <p><strong>الساعة العاشرة ليلًا</strong>، تصلك رسالة واتساب من صديق قديم: «يا أخي أرسلتُ رقمك بالغلط لتفعيل حسابي، سيصلك رمز، ابعثه لي بسرعة». تبعث الرمز لتساعده. بعد دقائق تُطرد من حسابك، ويبدأ المحتال بمراسلة جهات اتصالك بنفس الأسلوب. الصديق لم يكن صديقًا؛ حسابه كان مخترقًا بالطريقة نفسها، وأنت صرت الحلقة التالية في السلسلة.</p>
          <p>كل هجوم من هذا النوع يضغط على زر نفسي واحد من هذه الأزرار:</p>
          <ul>
            <li><strong>الاستعجال:</strong> «افعلها الآن وإلا...» حتى لا تجد وقتًا للتفكير.</li>
            <li><strong>السلطة:</strong> انتحال بنك أو جهة أمنية أو مدير عملك، فتطيع دون سؤال.</li>
            <li><strong>الطمع:</strong> جائزة أو ربح سريع أو عرض «لا يتكرر».</li>
            <li><strong>الود والشفقة:</strong> صديق أو قريب في ورطة يطلب مساعدة عاجلة.</li>
            <li><strong>الفضول:</strong> «شاهد من نشر صورك!» أو ملف مجهول المصدر.</li>
          </ul>
          <p><strong>كيف تدافع؟ قواعد بسيطة:</strong></p>
          <ul>
            <li><strong>توقّف عشر ثوانٍ</strong> قبل أي خطوة فيها مال أو رمز أو بيانات. المحتال يخسر كثيرًا حين تتمهل.</li>
            <li><strong>تحقق عبر قناة ثانية:</strong> اتصل بصديقك صوتيًا، أو بجهتك عبر رقمها الرسمي، لا عبر وسيلة الرسالة نفسها.</li>
            <li><strong>أنت من يتصل لا هم:</strong> إن اتصل بك من يدّعي صفة رسمية، أنهِ المكالمة واتصل بالرقم الرسمي بنفسك.</li>
            <li><strong>لا ترسل رمزًا أبدًا:</strong> رمز التحقق هو مفتاح حسابك، ولا يطلبه موظف ولا صديق حقيقي.</li>
            <li><strong>اسأل سؤالًا لا يعرفه إلا الأصلي:</strong> تفصيلة بينكما، ولا تثق بصورة الملف الشخصي وحدها.</li>
          </ul>
          <div class="callout">
            <strong>القاعدة الذهبية:</strong> أي رسالة تجمع «استعجالًا» مع «طلب رمز أو مال» هي احتيال حتى يثبت العكس. وجرّب <a href="#msg-checker" style="color:var(--brass-bright);">فاحص الرسائل</a> في هذا الموقع على أي رسالة تشك فيها.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('lesson-13', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-lesson-13"></div>
          <button class="btn btn-ghost lesson-next" onclick="goToLesson('lesson-14')">التالي</button>
        </div>
      </details>

      <details class="lesson-block" id="lesson-14" data-level="beginner">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="li14" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><rect x="9" y="3" width="14" height="26" rx="3" stroke="url(#li14)" stroke-width="1.8"/><path d="M13 16l2.5 2.5L20 13" stroke="url(#li14)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 25h4" stroke="url(#li14)" stroke-width="1.8" stroke-linecap="round"/></svg></span>
          <span class="lesson-num">14</span>
          <span class="lesson-title">التحقق بخطوتين (2FA): قفل ثانٍ يوقف أغلب الاختراقات</span>
          <span class="quiz-score-badge" id="qbadge-lesson-14"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>كلمة المرور وحدها قد تُسرق بالتصيّد أو بتسريب موقع استخدمته. <strong>التحقق بخطوتين</strong> (2FA) يضيف خطوة ثانية لا يملكها المهاجم: شيئًا تملكه أنت، كهاتفك أو مفتاح أمان. فلو عرف كلمة مرورك يبقى الباب مغلقًا أمامه.</p>
          <p><strong>أنواعه، من الأضعف إلى الأقوى:</strong></p>
          <ul>
            <li><strong>رسالة SMS:</strong> أفضل من لا شيء، لكن يمكن اعتراضها أو سرقة رقمك بحيلة تبديل الشريحة (SIM Swap).</li>
            <li><strong>تطبيق مصادقة</strong> (مثل Google Authenticator أو Microsoft Authenticator): يولّد رمزًا يتغير كل نصف دقيقة على هاتفك، ولا يمر عبر شبكة الاتصالات.</li>
            <li><strong>مفتاح مرور (Passkey) أو مفتاح أمان:</strong> الأقوى، لأنه لا يعمل إلا مع موقع الجهة الحقيقي، فلا يخدعه التصيّد.</li>
          </ul>
          <p><strong>كيف تفعّله؟ الخطوات متشابهة في أغلب المنصات:</strong></p>
          <ul>
            <li><strong>الخطوة 1:</strong> افتح إعدادات الحساب ← «الأمان» ← «التحقق بخطوتين».</li>
            <li><strong>الخطوة 2:</strong> اختر «تطبيق المصادقة» إن توفّر بدل الرسائل.</li>
            <li><strong>الخطوة 3:</strong> امسح رمز QR بالتطبيق، ثم اكتب الرمز الذي يظهر لتأكيد التفعيل.</li>
            <li><strong>الخطوة 4:</strong> احفظ <strong>رموز الاسترداد</strong> (Backup Codes) التي تُعرض لك في مكان آمن خارج هاتفك، فهي منقذك إن ضاع الهاتف.</li>
          </ul>
          <p>ابدأ بالأهم: <strong>بريدك الإلكتروني أولًا</strong> لأنه يستعيد كل حساباتك، ثم حساباتك المالية، ثم التواصل الاجتماعي.</p>
          <p><strong>أخطاء شائعة تُفقده قيمته:</strong></p>
          <ul>
            <li>مشاركة رمز التحقق مع أحد، حتى لو بدا موظف دعم.</li>
            <li>عدم حفظ رموز الاسترداد، ثم فقدان الهاتف.</li>
            <li>الضغط على «موافقة» لإشعار دخول لم تطلبه. بعض المهاجمين يغرقونك بالإشعارات حتى تضغط بالخطأ، وأي إشعار لم تطلبه يعني أن أحدًا يعرف كلمة مرورك: ارفضه وغيّرها فورًا.</li>
          </ul>
          <div class="callout">
            <strong>تذكير:</strong> التحقق بخطوتين لا يغني عن كلمة مرور قوية، لكنه يجعل سرقتها وحدها بلا فائدة. فعّله اليوم على بريدك؛ خمس دقائق تحميك لسنوات.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('lesson-14', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-lesson-14"></div>
          <a href="#checklist" class="btn btn-ghost lesson-next">قائمة الفحص</a>
        </div>
      </details>
    </div>
  </div>

      <details class="lesson-block" id="code-01" data-level="beginner">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="liC1" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M16 4 a8 8 0 0 1 5 14.3 c-1 .8-1.5 1.7-1.5 2.9v1.3h-7v-1.3c0-1.2-.5-2.1-1.5-2.9A8 8 0 0 1 16 4z" stroke="url(#liC1)" stroke-width="1.8"/><line x1="13" y1="26" x2="19" y2="26" stroke="#3d8bff" stroke-width="1.6" stroke-linecap="round"/><line x1="14" y1="29" x2="18" y2="29" stroke="#3d8bff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span class="lesson-num">01</span>
          <span class="lesson-title">ما الذي يحدث فعليًا عند زيارة موقع؟</span>
          <span class="quiz-score-badge" id="qbadge-code-01"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>أي موقع إلكتروني تراه، مهما بدا معقّدًا، مبني من ثلاث طبقات فقط تعمل معًا. فكّر فيه كمنزل: الهيكل أولًا، ثم الديكور، ثم الكهرباء والحركة.</p>
          <ul>
            <li><strong>HTML يبني الهيكل:</strong> العناوين، الفقرات، الصور، الروابط — المحتوى الخام بلا أي شكل.</li>
            <li><strong>CSS يُلبس هذا الهيكل شكلاً:</strong> الألوان، الخطوط، المسافات، وترتيب العناصر على الشاشة.</li>
            <li><strong>JavaScript يُضيف الحياة:</strong> ضغطة زر تفتح قائمة، نموذج يتحقق من بياناتك، صفحة تتحدّث دون إعادة تحميل.</li>
            <li>متصفحك (كروم أو سفاري) يقرأ هذه الملفات الثلاثة في أجزاء من الثانية ويدمجها في الصفحة التي تراها.</li>
          </ul>
          <div class="callout">
            <strong>من أين أبدأ؟</strong> لا تحتاج لتعلّم الثلاثة دفعة واحدة. ابدأ بـHTML — فهو الأساس الذي يقوم عليه كل شيء آخر في هذا القسم.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('code-01', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-code-01"></div>
          <button class="btn btn-ghost lesson-next" onclick="goToLesson('code-02')">التالي</button>
        </div>
      </details>

      <details class="lesson-block" id="code-02" data-level="beginner">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="liC2" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M11 9 L4 16 L11 23" stroke="url(#liC2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M21 9 L28 16 L21 23" stroke="url(#liC2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="18" y1="6" x2="14" y2="26" stroke="#3d8bff" stroke-width="1.4" stroke-linecap="round"/></svg></span>
          <span class="lesson-num">02</span>
          <span class="lesson-title">HTML — لغة هيكلة الصفحات</span>
          <span class="quiz-score-badge" id="qbadge-code-02"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>HTML (HyperText Markup Language) ليست "لغة برمجة" بالمعنى الدقيق، بل لغة وَسْم (Markup) تصف محتوى الصفحة عنصرًا بعنصر، باستخدام وسوم (Tags) بين قوسين مثل هذه:</p>
          <div class="code-block">&lt;h1&gt;مرحبًا بالعالم&lt;/h1&gt;
&lt;p&gt;هذه فقرة نصية بسيطة.&lt;/p&gt;
&lt;a href="https://example.com"&gt;رابط&lt;/a&gt;</div>
          <ul>
            <li>كل عنصر يُكتب غالبًا بوسم فتح ووسم إغلاق: <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">&lt;p&gt; ... &lt;/p&gt;</span>.</li>
            <li>العناوين من <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">h1</span> إلى <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">h6</span>، والفقرات <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">p</span>، والصور <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">img</span>، والروابط <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">a</span>.</li>
            <li>الصفحة كلها توضع داخل وسم <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">html</span>، وتنقسم إلى <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">head</span> (معلومات غير مرئية مثل العنوان) و<span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">body</span> (كل ما يراه الزائر).</li>
          </ul>
          <div class="callout">
            <strong>ملاحظة:</strong> HTML وحدها لا "تُبرمج" شيئًا — إنها تصف المحتوى فقط. القوة الحقيقية تظهر حين تضيف لها CSS وJavaScript، كما في الدرسين القادمين.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('code-02', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-code-02"></div>
          <button class="btn btn-ghost lesson-next" onclick="goToLesson('code-03')">التالي</button>
        </div>
      </details>

      <details class="lesson-block" id="code-03" data-level="intermediate">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="liC3" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M16 5 a11 9 0 1 0 0 18 c2 0 2-2 .5-3 c-1-1-.3-2.5 1-2.5 h2.5 a7 6 0 0 0 7-6 c0-3.5-4.7-6.5-11-6.5z" stroke="url(#liC3)" stroke-width="1.6"/><circle cx="11" cy="14" r="1.3" fill="#3d8bff"/><circle cx="16" cy="11" r="1.3" fill="#c4b5fd"/><circle cx="21" cy="14" r="1.3" fill="#3d8bff"/><circle cx="12" cy="19" r="1.3" fill="#c4b5fd"/></svg></span>
          <span class="lesson-num">03</span>
          <span class="lesson-title">CSS — لغة التنسيق والتصميم</span>
          <span class="quiz-score-badge" id="qbadge-code-03"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>إذا كانت HTML تضع المحتوى على الصفحة، فـCSS (Cascading Style Sheets) تقرر كيف يبدو هذا المحتوى. مثال بسيط:</p>
          <div class="code-block">h1 {
  color: #9a52ff;
  text-align: center;
}</div>
          <ul>
            <li>"المحدد" (Selector، هنا <span dir="ltr" style="font-family:var(--mono); font-size:12.5px;">h1</span>) يختار أي عنصر سيُنسَّق، والخصائص داخل الأقواس تحدّد شكله.</li>
            <li>يمكن التحكم بالألوان، الخطوط، الأحجام، المسافات، وحتى الحركة (Animations) بالكامل عبر CSS.</li>
            <li><strong>Flexbox</strong> و<strong>Grid</strong> هما أشهر أداتين لترتيب عناصر الصفحة بشكل منظّم ومتجاوب.</li>
            <li>"التصميم المتجاوب" (Responsive Design) يعني أن الموقع يبدو جيدًا على الهاتف والحاسوب معًا — وهو معيار أساسي اليوم.</li>
          </ul>
          <div class="callout">
            <strong>مثال حي:</strong> المظهر الزجاجي (Liquid Glass) والألوان المتدرّجة التي تراها في هذا الموقع نفسه مبنية بالكامل بـCSS.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('code-03', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-code-03"></div>
          <button class="btn btn-ghost lesson-next" onclick="goToLesson('code-04')">التالي</button>
        </div>
      </details>

      <details class="lesson-block" id="code-04" data-level="intermediate">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="liC4" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><path d="M18 4 L8 18 h6 l-2 10 12-16 h-6 z" stroke="url(#liC4)" stroke-width="1.6" stroke-linejoin="round" fill="none"/></svg></span>
          <span class="lesson-num">04</span>
          <span class="lesson-title">JavaScript — لغة البرمجة التفاعلية</span>
          <span class="quiz-score-badge" id="qbadge-code-04"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>JavaScript هي اللغة التي تجعل الصفحة "تُفكّر" بدل أن تبقى ثابتة. مثال بسيط لدالة تظهر رسالة عند الضغط على زر:</p>
          <div class="code-block">function sayHello() {
  alert("مرحبًا!");
}</div>
          <ul>
            <li>تسمح باتخاذ قرارات (إن كان كذا، افعل كذا)، وتكرار إجراءات، والتفاعل الفوري مع ضغطات المستخدم.</li>
            <li>تعمل مباشرة داخل متصفحك دون الحاجة لتثبيت أي برنامج إضافي.</li>
            <li>كل أداة تفاعلية في هذا الموقع — فاحص كلمة المرور، لعبة الروابط، شريط البحث الزجاجي — مبنية بـJavaScript.</li>
            <li>أطر عمل مثل <strong>React</strong> و<strong>Vue</strong> مبنية فوق JavaScript لتسهيل بناء مواقع كبيرة ومعقّدة بسرعة.</li>
          </ul>
          <div class="callout">
            <strong>زاوية أمنية:</strong> JavaScript من أكثر اللغات استهدافًا بثغرات مثل XSS (حقن أكواد خبيثة في صفحة). فهمها يفتح لك بابين معًا: كيف تَبني، وكيف تَحمي ما بنيته.
          </div>
          <button type="button" class="btn btn-quiz" onclick="openLessonQuiz('code-04', this)">📝 اختبر فهمك في هذا الدرس</button>
          <div class="quiz-host" id="quiz-host-code-04"></div>
          <button class="btn btn-ghost lesson-next" onclick="goToLesson('code-05')">التالي</button>
        </div>
      </details>

      <details class="lesson-block" id="code-05" data-level="advanced">
        <summary>
          <span class="lesson-icon"><svg viewBox="0 0 32 32" width="26" height="26" fill="none"><defs><linearGradient id="liC5" x1="4" y1="2" x2="28" y2="30"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#3d8bff"/></linearGradient></defs><rect x="5" y="14" width="22" height="13" rx="2" stroke="url(#liC5)" stroke-width="1.6"/><path d="M11 14 v-3 a2 2 0 0 1 2-2 h6 a2 2 0 0 1 2 2 v3" stroke="#3d8bff" stroke-width="1.6" fill="none"/><line x1="5" y1="20" x2="27" y2="20" stroke="#3d8bff" stroke-width="1.4"/><rect x="14" y="18" width="4" height="4" rx="0.5" fill="#c4b5fd"/></svg></span>
          <span class="lesson-num">05</span>
          <span class="lesson-title">أشهر أدوات ولغات البرمجة</span>
          <span class="quiz-score-badge" id="qbadge-code-05"></span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>بعد HTML وCSS وJavaScript، هذه أشهر الأدوات التي يستخدمها المطوّرون فعليًا في بناء المواقع والتطبيقات:</p>
          <ul>
            <li><strong>محرر الأكواد:</strong> البرنامج الذي تكتب به الكود — الأشهر عالميًا هو Visual Studio Code، وهو مجاني.</li>
            <li><strong>Git وGitHub:</strong> نظام يتتبّع كل تعديل تجريه على الكود، ومنصة لحفظ مشاريعك ومشاركتها — بالضبط كما تفعل الآن مع موقعك.</li>
            <li><strong>لغات الواجهة الخلفية (Backend):</strong> مثل Python وNode.js وPHP — تُشغّل منطق الموقع وقواعد البيانات خلف الكواليس.</li>
            <li><strong>قواعد البيانات:</strong> مثل MySQL وMongoDB وFirebase — تُخزّن بيانات المستخدمين والمحتوى بشكل دائم.</li>
            <li><strong>أطر عمل الواجهة الأمامية:</strong> مثل React وVue وTailwind CSS — تسرّع بناء واجهات حديثة.</li>
          </ul>
          <div class="callout">
            <strong>لا تنتظر إتقان كل شيء:</strong> HTML وCSS وJavaScript وحدها كافية لبناء موقع كامل تراه الآن. بقية الأدوات تُضاف تدريجيًا حين تحتاجها فعليًا في مشروع حقيقي.

        <summary>
          <span class="lesson-title">تويتر 2020: كيف اخترق مراهق أكبر حسابات العالم</span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>في يوليو 2020، تمكّنت مجموعة صغيرة من المهاجمين — أحدهم مراهق عمره 17 سنة — من اختراق حسابات موثّقة لشخصيات مثل باراك أوباما وإيلون ماسك وبيل غيتس على تويتر في نفس الوقت تقريبًا. الطريقة ما كانت تقنية معقّدة: اتصلوا هاتفيًا بموظفين في تويتر منتحلين صفة الدعم التقني الداخلي، وأقنعوهم بتسليم بيانات دخول لأدوات إدارية حساسة. بمجرد وصولهم، نشروا من الحسابات المخترقة رسالة تطلب تحويل عملة بيتكوين مقابل "مضاعفتها"، وجمعوا أكثر من 118 ألف دولار خلال ساعات قليلة.</p>
          <div class="callout">
            <strong>الدرس:</strong> حتى الشركات العملاقة تسقط ضحية الهندسة الاجتماعية البسيطة. الثغرة لم تكن تقنية — كانت إنسانية: موظف واحد اقتنع بمكالمة هاتفية.
          </div>
        </div>
      </details>

      <details class="lesson-block">
        <summary>
          <span class="lesson-title">كولونيال بايبلاين 2021: كلمة مرور واحدة أوقفت الوقود عن نصف أمريكا</span>
          <span class="lesson-toggle">+</span>
        </summary>
        <div class="lesson-body">
          <p>في مايو 2021، اضطرت شركة Colonial Pipeline — المسؤولة عن نقل نحو 45% من وقود الساحل الشرقي الأمريكي — لإيقاف عملياتها بالكامل بعد هجوم فدية. السبب: كلمة مرور واحدة قديمة لحساب VPN لم تعد قيد الاستخدام الفعلي، لكنها بقيت فعّالة وبدون توثيق ثنائي. كانت هذي الكلمة قد تسرّبت سابقًا في اختراق آخر غير مرتبط، واستخدمها المهاجمون للدخول مباشرة. دفعت الشركة نحو 4.4 مليون دولار كفدية.</p>
          <div class="callout">
            <strong>الدرس:</strong> حساب واحد منسي بدون توثيق ثنائي يقدر يوقف شركة كاملة. هذا بالضبط سبب أهمية حذف الحسابات غير المستخدمة وتفعيل التوثيق الثنائي بكل مكان.
          </div>
        </div>
      </details>
    </div>
  </div>
</section>

<section id="glossary" style="background:var(--panel); border-top:1px solid var(--line); border-bottom:1px solid var(--line);">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">قاموس مصطلحات</span>
      <h2>مفاهيم تقنية بلغة بسيطة</h2>
      <p>مصطلحات تسمعها كثيرًا بعالم الأمن السيبراني، بشرح لا يحتاج خلفية تقنية.</p>
    </div>
    <div class="glossary-grid">
      <div class="glossary-item"><h4>Phishing — تصيّد احتيالي</h4><p>محاولة خداعك لتكشف بيانات حساسة عبر انتحال جهة موثوقة.</p></div>
      <div class="glossary-item"><h4>Malware — برمجية خبيثة</h4><p>أي برنامج مصمم لإلحاق الضرر أو التجسس أو سرقة بيانات جهازك.</p></div>
      <div class="glossary-item"><h4>Ransomware — فدية</h4><p>برمجية تشفّر ملفاتك وتطلب مالًا مقابل فك التشفير عنها.</p></div>
      <div class="glossary-item"><h4>VPN — شبكة خاصة افتراضية</h4><p>تشفّر اتصالك بالإنترنت وتخفي موقعك الحقيقي عن المراقبين.</p></div>
      <div class="glossary-item"><h4>2FA / MFA — توثيق ثنائي</h4><p>طبقة تحقق إضافية غير كلمة المرور، مثل رمز مؤقت أو بصمة.</p></div>
      <div class="glossary-item"><h4>Firewall — جدار الحماية</h4><p>يراقب حركة البيانات الداخلة والخارجة من جهازك ويمنع المشبوه منها.</p></div>
      <div class="glossary-item"><h4>Encryption — تشفير</h4><p>تحويل البيانات لصيغة غير مقروءة إلا لمن يملك المفتاح الصحيح.</p></div>
      <div class="glossary-item"><h4>Zero-day — ثغرة يوم الصفر</h4><p>ثغرة أمنية مكتشفة حديثًا لم يصدر لها إصلاح بعد.</p></div>
      <div class="glossary-item"><h4>Botnet — شبكة روبوتات</h4><p>شبكة أجهزة مخترقة يتحكم بها مهاجم واحد عن بعد دون علم أصحابها.</p></div>
      <div class="glossary-item"><h4>Keylogger — مسجّل ضغطات المفاتيح</h4><p>برنامج يسجّل كل ما تكتبه على لوحة المفاتيح، بما فيه كلمات المرور.</p></div>
      <div class="glossary-item"><h4>Social Engineering — هندسة اجتماعية</h4><p>استغلال الثقة النفسية بدل الثغرات التقنية للوصول لمعلوماتك.</p></div>
      <div class="glossary-item"><h4>Brute Force — القوة الغاشمة</h4><p>تجربة آلاف الاحتمالات المتتالية آليًا لتخمين كلمة مرور.</p></div>
      <div class="glossary-item"><h4>Spyware — برمجية تجسس</h4><p>تعمل بصمت لمراقبة نشاطك وجمع بياناتك دون علمك.</p></div>
      <div class="glossary-item"><h4>Trojan Horse — حصان طروادة</h4><p>برمجية تتخفى بمظهر تطبيق مفيد بينما تخفي بداخلها كودًا ضارًا.</p></div>
      <div class="glossary-item"><h4>Worm — دودة حاسوبية</h4><p>برمجية خبيثة تنسخ نفسها وتنتشر تلقائيًا بين الأجهزة دون تدخل المستخدم.</p></div>
      <div class="glossary-item"><h4>Spoofing — انتحال</h4><p>تزييف هوية مرسل (بريد، رقم، موقع) ليبدو وكأنه جهة موثوقة.</p></div>
      <div class="glossary-item"><h4>Man-in-the-Middle — هجوم الوسيط</h4><p>اعتراض الاتصال بين طرفين للتجسس عليه أو التلاعب به دون علمهما.</p></div>
      <div class="glossary-item"><h4>Patch — تحديث أمني</h4><p>إصلاح برمجي يغلق ثغرة أمنية مكتشفة في نظام أو تطبيق.</p></div>
      <div class="glossary-item"><h4>Data Breach — تسرّب بيانات</h4><p>وصول غير مصرّح به لبيانات حساسة، غالبًا تُنشر أو تُباع لاحقًا.</p></div>
      <div class="glossary-item"><h4>HTTPS / SSL — اتصال مشفّر</h4><p>بروتوكول يشفّر البيانات بين متصفحك والموقع؛ يظهر كقفل بشريط العنوان.</p></div>
      <div class="glossary-item"><h4>Sandbox — بيئة معزولة</h4><p>مساحة منفصلة لتشغيل ملف مشبوه بأمان دون التأثير على باقي النظام.</p></div>
    </div>
  </div>
</section>

        </div>
      </div>
    </div>
    <div class="rf-explanations">
      <div class="rf-exp" id="rf-exp-1"><strong>١ — اسم عرض مألوف، لكن...</strong>اسم المرسل الظاهر يمكن أن يكون أي شيء يختاره المحتال بحرية تامة؛ الاسم وحده لا يثبت شيئًا.</div>
      <div class="rf-exp" id="rf-exp-2"><strong>٢ — نطاق مزيف بحرف مشابه</strong>"bnk-natlonal-secure.com" ليس نطاق أي بنك حقيقي؛ لاحظ استبدال حرف i بـ l لخداع العين عند القراءة السريعة.</div>
      <div class="rf-exp" id="rf-exp-3"><strong>٣ — إلحاح وتهديد مبالغ فيه</strong>عبارات مثل "عاجل جدًا" و"خلال 24 ساعة" مصممة خصيصًا لدفعك للتصرف دون تفكير أو تدقيق.</div>
      <div class="rf-exp" id="rf-exp-4"><strong>٤ — أخطاء إملائية وصياغة غير طبيعية</strong>"حسابكـ" و"فورا" بدون همزة، و"تأكيد بياناتكم" صياغة ركيكة لا تصدر عادة عن جهة رسمية محترفة.</div>
      <div class="rf-exp" id="rf-exp-5"><strong>٥ — زر يقود لصفحة تصيّد</strong>أزرار "تأكيد الحساب الآن" في رسائل غير متوقعة تقود غالبًا لصفحة دخول مزيفة مصممة لسرقة بياناتك فور كتابتها.</div>
    </div>
  </div>
</section>

<section id="local-scams" style="border-top:1px solid var(--line); border-bottom:1px solid var(--line);">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">دليل محلي</span>
      <h2>أشهر أساليب الاحتيال حولنا</h2>
      <p>الصيغ تتغير والفكرة واحدة: استعجال، أو طمع، أو ثقة مصطنعة. اضغط على أي أسلوب لتعرف كيف يعمل، وما علامته الحمراء، وماذا تفعل.</p>
    </div>
    <div class="vx-scams">
      <details class="vx-scam">
        <summary><span class="vx-scam-icon">🎁</span>«ربحت جائزة!» باسم شركة اتصالات أو متجر</summary>
        <div class="vx-scam-body">
          <p><strong>كيف تعمل:</strong> تصلك رسالة أو إعلان بأنك فزت بهاتف أو رصيد أو مبلغ في سحب لم تشارك فيه، ثم يطلبون «رسوم شحن» أو بياناتك أو ضغط رابط لاستلام الجائزة.</p>
          <p><strong>🚩 العلامة الحمراء:</strong> جائزة لمسابقة لم تشارك فيها، مع طلب أي مبلغ أو بيانات بطاقة قبل الاستلام.</p>
          <p><strong>✅ ماذا تفعل:</strong> تجاهل الرسالة وأبلغ عنها. الجوائز الحقيقية لا تُطلب عليها رسوم مسبقة. وللتأكد، اكتب اسم الشركة بنفسك في البحث وراجع صفحتها الرسمية.</p>
        </div>
      </details>
      <details class="vx-scam">
        <summary><span class="vx-scam-icon">🏦</span>«حسابك سيُجمّد» باسم البنك أو البريد</summary>
        <div class="vx-scam-body">
          <p><strong>كيف تعمل:</strong> رسالة أو مكالمة تدّعي أن حسابك البنكي أو البريدي مهدد بالإيقاف، وتطلب منك «تحديث بياناتك» عبر رابط أو إعطاء رمز يصلك على هاتفك.</p>
          <p><strong>🚩 العلامة الحمراء:</strong> طلب رمز التحقق أو الرقم السري أو بيانات البطاقة، مع تهديد بإيقاف الحساب خلال ساعات.</p>
          <p><strong>✅ ماذا تفعل:</strong> لا تضغط ولا تُجب. اتصل بجهتك مباشرة عبر رقمها الرسمي المكتوب على بطاقتك أو موقعها المعروف مسبقًا. لا جهة حقيقية تطلب رمزك السري.</p>
        </div>
      </details>
      <details class="vx-scam">
        <summary><span class="vx-scam-icon">🛒</span>إعلان بيع بسعر مغرٍ (هاتف، سيارة، عقار)</summary>
        <div class="vx-scam-body">
          <p><strong>كيف تعمل:</strong> إعلان على مواقع البيع أو وسائل التواصل بسعر أقل بكثير من السوق. البائع «مسافر» أو «بعيد»، ويطلب عربونًا أو دفعًا مسبقًا ويعدك بالشحن.</p>
          <p><strong>🚩 العلامة الحمراء:</strong> سعر أرخص من المعقول، مع رفض اللقاء والمعاينة والإلحاح على الدفع المسبق عبر تحويل.</p>
          <p><strong>✅ ماذا تفعل:</strong> عاين السلعة وتسلّمها قبل أي دفع، والتقِ في مكان عام. إن رفض البائع فهذه إشارة كافية للانسحاب.</p>
        </div>
      </details>
      <details class="vx-scam">
        <summary><span class="vx-scam-icon">💼</span>عرض عمل من المنزل أو «اربح من الإنترنت»</summary>
        <div class="vx-scam-body">
          <p><strong>كيف تعمل:</strong> وعد براتب مرتفع لعمل بسيط (تقييم منتجات، إعجابات، إدخال بيانات)، ثم يطلبون رسوم تسجيل أو «تأمين»، أو نسخة من هويتك وبياناتك البنكية.</p>
          <p><strong>🚩 العلامة الحمراء:</strong> أي وظيفة تطلب منك مالًا أولًا، أو تعد بأرباح كبيرة بلا خبرة ولا مقابلة.</p>
          <p><strong>✅ ماذا تفعل:</strong> لا تدفع لتحصل على عمل. لا ترسل صورة هويتك أو بياناتك البنكية قبل أن تتأكد أن الشركة موجودة فعليًا، ولها عنوان ومقابلة رسمية.</p>
        </div>
      </details>
      <details class="vx-scam">
        <summary><span class="vx-scam-icon">🧑‍🤝‍🧑</span>«صديقك في ورطة» من حساب مخترق</summary>
        <div class="vx-scam-body">
          <p><strong>كيف تعمل:</strong> تصلك رسالة من حساب صديق (بعد اختراقه) يطلب «شحن رصيد» أو «تحويل مبلغ مؤقتًا»، أو يقول: «أرسل لي الرمز الذي وصلك بالخطأ».</p>
          <p><strong>🚩 العلامة الحمراء:</strong> طلب مال أو رمز من صديق عبر الكتابة فقط، بأسلوب مستعجل أو غير معتاد.</p>
          <p><strong>✅ ماذا تفعل:</strong> اتصل بصديقك صوتيًا للتأكد قبل أي خطوة. ولا ترسل أي رمز مهما كان المرسل.</p>
        </div>
      </details>
      <details class="vx-scam">
        <summary><span class="vx-scam-icon">👮</span>انتحال جهة رسمية (أمن، ضرائب، محكمة)</summary>
        <div class="vx-scam-body">
          <p><strong>كيف تعمل:</strong> اتصال أو رسالة تدّعي أن عليك غرامة أو قضية، وتطلب دفعًا فوريًا أو بيانات شخصية عبر واتساب أو رابط.</p>
          <p><strong>🚩 العلامة الحمراء:</strong> جهة رسمية تطلب الدفع أو المعلومات عبر رسالة أو تطبيق محادثة، وتهددك بالعقوبة إن لم تدفع فورًا.</p>
          <p><strong>✅ ماذا تفعل:</strong> أنهِ المحادثة، وتواصل مع الجهة بنفسك عبر قنواتها الرسمية للتحقق. الإجراءات الرسمية لا تتم بتحويل سريع ولا عبر رسالة.</p>
        </div>
      </details>
      <details class="vx-scam">
        <summary><span class="vx-scam-icon">📈</span>استثمار أو تداول بـ«أرباح مضمونة»</summary>
        <div class="vx-scam-body">
          <p><strong>كيف تعمل:</strong> شخص أو مجموعة تعرض عليك استثمارًا في العملات الرقمية أو التداول بأرباح يومية مضمونة، وتُظهر لك «أرباحًا» في تطبيق مزيف، ثم تمنعك من السحب إلا بعد دفع رسوم إضافية.</p>
          <p><strong>🚩 العلامة الحمراء:</strong> وعد بربح مضمون أو سريع، وضغط لإدخال أصدقائك، ورسوم لفتح السحب.</p>
          <p><strong>✅ ماذا تفعل:</strong> لا يوجد استثمار بربح مضمون. لا تودع مالًا في منصة لا تعرف ترخيصها، وابحث عن اسمها مع كلمة «نصب» قبل أي خطوة.</p>
        </div>
      </details>
    </div>
    <div class="incident-note" style="max-width:760px; margin:0 auto;">🆘 <strong>إن وقعت ضحية:</strong> أوقف التواصل فورًا، واحتفظ بلقطات الشاشة وأرقام العمليات، وأبلغ المنصة وبنكك، ثم توجّه إلى الجهات المختصة في بلدك لتقديم بلاغ. ولا تثق بمن يعرض عليك «استرجاع أموالك» مقابل مال، فهو احتيال ثانٍ.</div>
  </div>
</section>

      { q:'أيهما أقوى لحماية بريدك: تطبيق مصادقة أم رسائل SMS؟', options:['الرسائل النصية أقوى دائمًا','تطبيق المصادقة أقوى لأنه غير مرتبط برقم الهاتف','كلاهما متساويان تمامًا','لا فرق لأن كلاهما يعتمد على الإنترنت'], correct:1, explain:'تطبيق المصادقة غير معرّض لهجوم تبديل الشريحة الذي يستهدف رقم هاتفك.' }

    'lesson-06': [

    'lesson-09': [

    'lesson-10': [

  const quizState = {};

  function openLessonQuiz(lessonId, btn){
    if(!LESSON_QUIZZES[lessonId]) return;
    quizState[lessonId] = { index:0, score:0, answered:false };
    if(btn) btn.style.display = 'none';
    renderQuizQuestion(lessonId);

  function renderQuizQuestion(lessonId){
    const questions = LESSON_QUIZZES[lessonId];
    const state = quizState[lessonId];
    const host = document.getElementById('quiz-host-' + lessonId);
    if(!host) return;
    if(state.index >= questions.length){ renderQuizResult(lessonId); return; }
    const q = questions[state.index];
    state.answered = false;
    const optsHtml = q.options.map(function(opt, i){
      return '<button type="button" class="quiz-option" onclick="answerLessonQuiz(\'' + lessonId + '\', ' + i + ')">' + opt + '</button>';
    }).join('');
    host.innerHTML =
      '<div class="quiz-panel">' +
        '<div class="quiz-progress">سؤال ' + (state.index + 1) + ' من ' + questions.length + '</div>' +
        '<div class="quiz-question">' + q.q + '</div>' +
        '<div class="quiz-options">' + optsHtml + '</div>' +
        '<div class="quiz-explain" id="quiz-explain-' + lessonId + '" style="display:none;"></div>' +
        '<div class="quiz-nav" id="quiz-nav-' + lessonId + '" style="display:none;"><button type="button" class="btn btn-ghost" onclick="nextLessonQuiz(\'' + lessonId + '\')">السؤال التالي ←</button></div>' +
      '</div>';
  }

  function answerLessonQuiz(lessonId, choice){
    const state = quizState[lessonId];
    if(!state || state.answered) return;
    state.answered = true;
    const q = LESSON_QUIZZES[lessonId][state.index];
    const host = document.getElementById('quiz-host-' + lessonId);
    const buttons = host.querySelectorAll('.quiz-option');
    buttons.forEach(function(b, i){
      b.disabled = true;
      if(i === q.correct) b.classList.add('correct');
      else if(i === choice) b.classList.add('wrong');
    });
    if(choice === q.correct) state.score++;
    const explainEl = document.getElementById('quiz-explain-' + lessonId);
    explainEl.style.display = 'block';
    explainEl.innerHTML = (choice === q.correct ? '✅ إجابة صحيحة. ' : '❌ إجابة غير دقيقة. ') + q.explain;
    const navWrap = document.getElementById('quiz-nav-' + lessonId);
    navWrap.style.display = 'block';
    const navBtn = navWrap.querySelector('button');
    if(state.index + 1 >= LESSON_QUIZZES[lessonId].length){ navBtn.textContent = 'عرض النتيجة ←'; }
  }

  function nextLessonQuiz(lessonId){
    quizState[lessonId].index++;
    renderQuizQuestion(lessonId);
  }

  function renderQuizResult(lessonId){
    const questions = LESSON_QUIZZES[lessonId];
    const state = quizState[lessonId];
    const host = document.getElementById('quiz-host-' + lessonId);
    const total = questions.length;
    const score = state.score;
    let msg;
    if(score === total){ msg = 'ممتاز! إجابات كاملة 🎯'; }
    else if(score >= Math.ceil(total * 0.6)){ msg = 'جيد! يُستحسن مراجعة الأسئلة التي أخطأت فيها.'; }
    else { msg = 'يُستحسن مراجعة الدرس مرة أخرى قبل المتابعة.'; }
    host.innerHTML =
      '<div class="quiz-panel quiz-result">' +
        '<div class="quiz-score">' + score + ' / ' + total + '</div>' +
        '<p>' + msg + '</p>' +
        '<div class="quiz-result-actions">' +
          '<button type="button" class="btn btn-ghost" onclick="retryLessonQuiz(\'' + lessonId + '\')">إعادة المحاولة</button>' +
          '<button type="button" class="btn btn-ghost" onclick="shareLessonResult(\'' + lessonId + '\', ' + score + ', ' + total + ')">📤 تحدَّ صديقك</button>' +
        '</div>' +
      '</div>';
    saveQuizScore(lessonId, score, total);
  }

  function retryLessonQuiz(lessonId){
    quizState[lessonId] = { index:0, score:0, answered:false };
    renderQuizQuestion(lessonId);

  const COMMON_PASSWORDS = ['123456','123456789','password','12345678','qwerty','111111','123123','abc123','password1','admin','letmein','welcome','iloveyou','000000','1234567','12345','monkey','dragon','football','azerty','000000000','1q2w3e4r','zxcvbnm','test123'];

  function pwgenUpdateLenLabel(){

  function pwgenGenerate(){
    const len = parseInt(document.getElementById('pwgen-len').value, 10);
    const useUpper = document.getElementById('pwgen-upper').checked;
    const useNum = document.getElementById('pwgen-num').checked;
    const useSym = document.getElementById('pwgen-sym').checked;

    const lower = 'abcdefghijklmnopqrstuvwxyz';
    const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const nums = '0123456789';
    const syms = '!@#$%^&*()_-+=?';

    let pool = lower;
    if(useUpper) pool += upper;
    if(useNum) pool += nums;
    if(useSym) pool += syms;

    const randomValues = new Uint32Array(len);
    window.crypto.getRandomValues(randomValues);
    let result = '';
    for(let i = 0; i < len; i++){
      result += pool[randomValues[i] % pool.length];
    }
    document.getElementById('pwgen-output').value = result;
    try{ localStorage.setItem('vn_used_pwgen', '1'); }catch(e){}
    awardOnce('vn_awarded_pwgen', 10, 'ولّدت كلمة مرور قوية');
  }

  }

  async function sha1Hex(str){
    const enc = new TextEncoder().encode(str);
    const buf = await window.crypto.subtle.digest('SHA-1', enc);
    const bytes = Array.from(new Uint8Array(buf));
    return bytes.map(function(b){ return b.toString(16).padStart(2, '0'); }).join('').toUpperCase();
  }

  async function pwnedCheck(){
    const input = document.getElementById('pwned-input');
    const resultEl = document.getElementById('pwned-result');
    const btn = document.getElementById('pwned-check-btn');
    const pwd = input.value;
    if(!pwd){
      resultEl.className = 'pwned-result show error';
      resultEl.textContent = 'اكتب كلمة مرور أولاً.';
      return;
    }
    if(!window.crypto || !window.crypto.subtle || !window.fetch){
      resultEl.className = 'pwned-result show error';
      resultEl.textContent = 'متصفحك لا يدعم هذه الميزة.';
      return;
    }
    btn.disabled = true;
    resultEl.className = 'pwned-result show loading';
    resultEl.textContent = 'جارِ التحقق...';
    try{
      const hash = await sha1Hex(pwd);
      const prefix = hash.slice(0, 5);
      const suffix = hash.slice(5);
      const res = await fetch('https://api.pwnedpasswords.com/range/' + prefix);
      if(!res.ok) throw new Error('bad response');
      const text = await res.text();
      const lines = text.split('\n');
      let count = 0;
      for(let i = 0; i < lines.length; i++){
        const parts = lines[i].trim().split(':');
        if(parts[0] === suffix){ count = parseInt(parts[1], 10) || 0; break; }
      }
      if(count > 0){
        resultEl.className = 'pwned-result show danger';
        resultEl.innerHTML = '⚠️ كلمة المرور هذه ظهرت في تسريبات بيانات <strong>' + count.toLocaleString() + '</strong> مرة من قبل. غيّرها فورًا إن كنت تستخدمها فعليًا في أي حساب.';
      } else {
        resultEl.className = 'pwned-result show safe';
        resultEl.textContent = '✅ لم تظهر كلمة المرور هذه في قواعد التسريبات المعروفة. (هذا لا يعني أنها قوية تلقائيًا — راجع فاحص القوة أعلاه أيضًا)';
      }
      try{ localStorage.setItem('vn_used_pwned', '1'); }catch(e2){}
      awardOnce('vn_awarded_pwned', 10, 'فحصت كلمة مرور في قاعدة الاختراقات');
    }catch(e){
      resultEl.className = 'pwned-result show error';
      resultEl.textContent = 'تعذّر الاتصال بخدمة التحقق الآن. تأكد من اتصالك بالإنترنت وجرّب مجددًا.';
    }
    btn.disabled = false;
  }

  function estimateCrackSeconds(val, hasLower, hasUpper, hasNum, hasSym, isCommon){
    if(!val) return 0;
    if(isCommon) return 0.5;
    let pool = 0;
    if(hasLower) pool += 26;
    if(hasUpper) pool += 26;
    if(hasNum) pool += 10;
    if(hasSym) pool += 33;
    if(pool === 0) pool = 10;
    const combos = Math.pow(pool, val.length);
    const guessesPerSecond = 1e10; /* تقدير متحفّظ لجهاز كسر سريع متخصص */
    return combos / (2 * guessesPerSecond);
  }

  function formatCrackTime(seconds){
    if(!isFinite(seconds) || seconds < 1) return 'أقل من ثانية';
    const minute = 60, hour = 3600, day = 86400, month = day * 30, year = day * 365;
    if(seconds < minute) return Math.round(seconds) + ' ثانية';
    if(seconds < hour) return Math.round(seconds / minute) + ' دقيقة';
    if(seconds < day) return Math.round(seconds / hour) + ' ساعة';
    if(seconds < month) return Math.round(seconds / day) + ' يوم';
    if(seconds < year) return Math.round(seconds / month) + ' شهر';
    const years = seconds / year;
    if(years < 1000) return Math.round(years) + ' سنة';
    if(years < 1e6) return Math.round(years / 1000).toLocaleString('ar') + ' ألف سنة';
    if(years < 1e9) return Math.round(years / 1e6).toLocaleString('ar') + ' مليون سنة';
    if(years < 13.8e9) return Math.round(years / 1e9).toLocaleString('ar') + ' مليار سنة';
    return 'أكثر من عمر الكون (+13.8 مليار سنة) 🌌';
  }

  function checkPasswordStrength(){
    const inp = document.getElementById('pw-test-input');
    if(!inp) return;
    const val = inp.value;
    const fill = document.getElementById('pw-meter-fill');
    const label = document.getElementById('pw-label');
    const crackBox = document.getElementById('pw-crack-time');
    const crackText = document.getElementById('pw-crack-time-text');

    const hasLen = val.length >= 12;
    const hasUpper = /[A-Z]/.test(val);
    const hasLower = /[a-z]/.test(val);
    const hasCase = hasUpper && hasLower;
    const hasNum = /[0-9]/.test(val);
    const hasSym = /[^A-Za-z0-9]/.test(val);
    const isCommon = COMMON_PASSWORDS.indexOf(val.toLowerCase()) !== -1;

    setPwCriterion('pw-c-len', hasLen);
    setPwCriterion('pw-c-case', hasCase);
    setPwCriterion('pw-c-num', hasNum);
    setPwCriterion('pw-c-sym', hasSym);
    setPwCriterion('pw-c-common', val.length > 0 && !isCommon);

    if(val.length === 0){
      fill.style.width = '0%';
      fill.style.background = 'var(--line)';
      label.textContent = 'اكتب كلمة مرور لتبدأ';
      label.style.color = 'var(--muted)';
      if(crackBox) crackBox.className = 'pw-crack-time';
      return;
    }

    let score = 0;
    if(hasLen) score++;
    if(val.length >= 16) score++;
    if(hasCase) score++;
    if(hasNum) score++;
    if(hasSym) score++;

    let pct, color, text;
    if(isCommon){ pct = 8; color = '#ef4444'; text = 'ضعيفة جدًا — من أكثر كلمات المرور شيوعًا وتسريبًا'; }
    else if(score <= 1){ pct = 20; color = '#ef4444'; text = 'ضعيفة جدًا'; }
    else if(score === 2){ pct = 40; color = '#f97316'; text = 'ضعيفة'; }
    else if(score === 3){ pct = 60; color = '#eab308'; text = 'متوسطة'; }
    else if(score === 4){ pct = 80; color = '#3d8bff'; text = 'قوية'; }
    else { pct = 100; color = '#c4b5fd'; text = 'قوية جدًا'; }

    fill.style.width = pct + '%';
    fill.style.background = color;
    label.textContent = text;
    label.style.color = color;

    if(crackBox && crackText){
      const crackSeconds = estimateCrackSeconds(val, hasLower, hasUpper, hasNum, hasSym, isCommon);
      let tier = 'weak';
      if(pct >= 100) tier = 'excellent';
      else if(pct >= 80) tier = 'strong';
      else if(pct >= 60) tier = 'medium';
      crackBox.className = 'pw-crack-time show ' + tier;
      crackText.textContent = 'وقت كسرها تقريبًا: ' + formatCrackTime(crackSeconds) + ' (بافتراض جهاز كسر سريع متخصص)';
    }
    if(val.length >= 4){ awardOnce('vn_awarded_crackmeter', 10, 'جربت محاكي وقت كسر كلمة المرور'); }
  }

  let vishIndex = 0;
  let vishSelected = {};
  let vishChecked = false;
  let vishScore = { correct: 0, total: 0 };

  function startVishingSim(){
    vishIndex = 0;
    vishScore = { correct: 0, total: 0 };
    renderVishingScenario();
  }

  function renderVishingScenario(){
    const host = document.getElementById('vish-host');
    if(!host) return;
    try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
    if(vishIndex >= VISHING_SCENARIOS.length){ renderVishingFinal(); return; }
    const sc = VISHING_SCENARIOS[vishIndex];
    vishSelected = {};
    vishChecked = false;

    const linesHtml = sc.lines.map(function(l){ return '<div class="sms-bubble">' + l + '</div>'; }).join('');
    const chipsHtml = sc.flags.map(function(f){
      return '<button type="button" class="phish-chip" id="vish-chip-' + f.id + '" onclick="vishToggleChip(\'' + f.id + '\')">' + f.label + '</button>';
    }).join('');
    const canSpeak = ('speechSynthesis' in window);

    host.innerHTML =
      '<div class="phish-progress">المكالمة ' + (vishIndex + 1) + ' من ' + VISHING_SCENARIOS.length + '</div>' +
      '<div class="sms-phone">' +
        '<div class="sms-sender-row">' +
          '<div class="sms-avatar">' + sc.avatar + '</div>' +
          '<div><div class="sms-sender-name">' + sc.callerName + '</div><div class="sms-sender-number">' + sc.callerNumber + '</div></div>' +
        '</div>' +
        '<div class="vish-callbar">' +
          '<span class="vish-call-status"><span class="dot"></span> مكالمة واردة</span>' +
          (canSpeak
            ? '<button type="button" class="btn btn-ghost" id="vish-play-btn" onclick="vishPlayAudio()">🔊 استمع للمكالمة</button>'
            : '<span class="vish-unsupported">الاستماع الصوتي غير مدعوم هنا — اقرأ النص أدناه</span>') +
        '</div>' +
        linesHtml +
      '</div>' +
      '<p style="font-size:12.5px; color:var(--muted); margin-bottom:10px; text-align:center;">اضغط على كل عنصر تراه علامة احتيال محتملة:</p>' +
      '<div class="phish-chips">' + chipsHtml + '</div>' +
      '<div id="vish-feedback"></div>' +
      '<div id="vish-actions" style="text-align:center; margin-top:16px;">' +
        '<button type="button" class="btn btn-primary" onclick="vishCheckAnswer()">تحقق من إجابتي</button>' +
      '</div>';
  }

  function vishPlayAudio(){
    const sc = VISHING_SCENARIOS[vishIndex];
    const btn = document.getElementById('vish-play-btn');
    if(!sc || !('speechSynthesis' in window)) return;
    if(window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      if(btn) btn.textContent = '🔊 استمع للمكالمة';
      return;
    }
    try{
      const utter = new SpeechSynthesisUtterance(sc.lines.join(' ... '));
      utter.lang = 'ar-SA';
      utter.rate = 0.95;
      utter.onend = function(){ if(btn) btn.textContent = '🔊 استمع للمكالمة'; };
      utter.onerror = function(){ if(btn) btn.textContent = '🔊 استمع للمكالمة'; };
      if(btn) btn.textContent = '⏸ إيقاف الاستماع';
      window.speechSynthesis.speak(utter);
    }catch(e){
      if(btn) btn.textContent = '🔊 استمع للمكالمة';
    }
  }

  function vishToggleChip(id){
    if(vishChecked) return;
    const btn = document.getElementById('vish-chip-' + id);
    if(!btn) return;
    if(vishSelected[id]){ delete vishSelected[id]; btn.classList.remove('selected'); }
    else { vishSelected[id] = true; btn.classList.add('selected'); }
  }

  function vishCheckAnswer(){
    if(vishChecked) return;
    vishChecked = true;
    const sc = VISHING_SCENARIOS[vishIndex];
    let feedbackHtml = '';
    sc.flags.forEach(function(f){
      const btn = document.getElementById('vish-chip-' + f.id);
      const picked = !!vishSelected[f.id];
      if(f.suspicious){
        vishScore.total++;
        if(picked){ vishScore.correct++; if(btn){ btn.classList.add('result-correct'); btn.classList.remove('selected'); } }
        else if(btn){ btn.classList.add('result-missed'); }
      } else if(picked && btn){
        btn.classList.add('result-wrong'); btn.classList.remove('selected');
      }
      if(btn) btn.disabled = true;
      feedbackHtml += '<div class="phish-feedback-item"><strong>' + f.label + '</strong> — ' + f.note + '</div>';
    });
    const fb = document.getElementById('vish-feedback');
    if(fb) fb.innerHTML = feedbackHtml;
    const actions = document.getElementById('vish-actions');
    if(actions){
      const isLast = vishIndex + 1 >= VISHING_SCENARIOS.length;
      actions.innerHTML = '<button type="button" class="btn btn-ghost" onclick="vishNext()">' + (isLast ? 'عرض النتيجة النهائية ←' : 'المكالمة التالية ←') + '</button>';
    }
  }

  function vishNext(){
    vishIndex++;
    renderVishingScenario();
  }

  function renderVishingFinal(){
    const host = document.getElementById('vish-host');
    if(!host) return;
    const pct = vishScore.total ? Math.round((vishScore.correct / vishScore.total) * 100) : 0;
    let verdict;
    if(pct >= 85) verdict = 'حاسة قوية جدًا لاكتشاف الاحتيال الصوتي — استمر هكذا 🛡️';
    else if(pct >= 60) verdict = 'جيد، لكن راجع دروس الأمان في الأعلى لتصقل ملاحظتك أكثر.';
    else verdict = 'هذا بالضبط سبب أهمية التدريب — راجع دروس الأمان في الأعلى وجرّب مجددًا.';
    try{
      const prevBest = parseInt(localStorage.getItem('vn_vish_best') || '-1', 10);
      if(vishScore.correct > prevBest) localStorage.setItem('vn_vish_best', String(vishScore.correct));
      localStorage.setItem('vn_vish_total', String(vishScore.total));
    }catch(e){}
    awardVishingPoints(vishScore.correct, vishScore.total);
    checkBadgeConditions();
    host.innerHTML =
      '<div class="phish-score-box">' +
        '<div class="big">' + vishScore.correct + ' / ' + vishScore.total + '</div>' +
        '<p style="color:var(--muted); margin:10px 0 18px;">علامات احتيال اكتشفتها بنجاح (' + pct + '%)</p>' +
        '<p style="margin-bottom:20px;">' + verdict + '</p>' +
        '<div class="quiz-result-actions">' +
          '<button type="button" class="btn btn-ghost" onclick="vishRestart()">أعد المحاولة من البداية</button>' +
          '<button type="button" class="btn btn-ghost" onclick="shareVishingResult(' + vishScore.correct + ',' + vishScore.total + ')">📤 تحدَّ صديقك</button>' +
        '</div>' +
      '</div>';
  }

  function vishRestart(){
    startVishingSim();
  }

  /* ---------- COMPLETION CERTIFICATE ---------- */
  function getCompletionStats(){
    const ids = [];
    for(let i = 1; i <= 14; i++){ ids.push('lesson-' + String(i).padStart(2, '0')); }
    for(let i = 1; i <= 5; i++){ ids.push('code-' + String(i).padStart(2, '0')); }
    let completed = 0, totalScore = 0, totalQuestions = 0;
    ids.forEach(function(id){
      let score = null, total = null;
      try{
        score = localStorage.getItem('vn_quiz_' + id);
        total = localStorage.getItem('vn_quiz_total_' + id);
      }catch(e){}
      if(score !== null && total !== null){
        completed++;
        totalScore += parseInt(score, 10) || 0;
        totalQuestions += parseInt(total, 10) || 0;
      }
    });
    return { completed: completed, totalLessons: ids.length, totalScore: totalScore, totalQuestions: totalQuestions };
  }

  function renderCertStats(){
    const el = document.getElementById('cert-stats');
    if(!el) return;
    const stats = getCompletionStats();
    const pct = stats.totalQuestions ? Math.round((stats.totalScore / stats.totalQuestions) * 100) : 0;
    el.innerHTML = '<p style="color:var(--muted);">أكملت اختبارات <strong style="color:var(--brass-bright);">' + stats.completed + '</strong> من أصل ' + stats.totalLessons + ' درسًا' + (stats.totalQuestions ? '، بمعدل إجابات صحيحة ' + pct + '%' : '') + '.</p>';
  }

  function generateCertificate(){
    const nameInput = document.getElementById('cert-name-input');
    let name = (nameInput.value || '').trim();
    if(!name){
      try{ name = sessionStorage.getItem('vn_visitor_name') || ''; }catch(e){}
    }
    if(!name) name = 'زائر مجهول';

    const stats = getCompletionStats();
    const canvas = document.getElementById('cert-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#08080e');
    grad.addColorStop(1, '#0d1620');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    function glow(x, y, r, color){
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    glow(120, 100, 260, 'rgba(154,82,255,0.25)');
    glow(W - 120, H - 100, 280, 'rgba(61,139,255,0.22)');

    ctx.strokeStyle = 'rgba(154,82,255,0.5)';
    ctx.lineWidth = 3;
    ctx.strokeRect(30, 30, W - 60, H - 60);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.strokeRect(42, 42, W - 84, H - 84);

    ctx.save();
    ctx.translate(W / 2 - 40, 108);
    ctx.scale(2, 2);
    const cg = ctx.createLinearGradient(6, 4, 34, 36);
    cg.addColorStop(0, '#a45cff'); cg.addColorStop(1, '#3d8bff');
    const shield = new Path2D('M20 3.5 L34.5 9 V20 C34.5 28.5 28 34.5 20 37 C12 34.5 5.5 28.5 5.5 20 V9 Z');
    ctx.fillStyle = 'rgba(154,82,255,0.16)'; ctx.fill(shield);
    ctx.strokeStyle = cg; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke(shield);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.stroke(new Path2D('M25.5 15 A7.5 7.5 0 1 0 25.5 25'));
    ctx.fillStyle = '#60a5fa'; ctx.beginPath(); ctx.arc(27.2, 20, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.font = "700 30px 'Poppins', Arial, sans-serif";
    const w1 = ctx.measureText('Cyber').width, w2 = ctx.measureText('dz').width;
    const x0 = W / 2 - (w1 + w2) / 2;
    ctx.fillStyle = '#a45cff'; ctx.fillText('Cyber', x0, 238);
    ctx.fillStyle = '#ffffff'; ctx.fillText('dz', x0 + w1, 238);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#9a52ff';
    ctx.font = "400 16px 'Tajawal', Arial, sans-serif";
    ctx.fillText('شهادة إتمام رحلة الأمان الرقمي', W / 2, 270);

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = "400 13px Arial, sans-serif";
    ctx.fillText('CERTIFICATE OF COMPLETION', W / 2, 292);

    ctx.fillStyle = '#ffffff';
    ctx.font = "700 44px 'Tajawal', Arial, sans-serif";
    ctx.fillText(name, W / 2, 400);

    ctx.strokeStyle = 'rgba(154,82,255,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 160, 420);
    ctx.lineTo(W / 2 + 160, 420);
    ctx.stroke();

    const pct = stats.totalQuestions ? Math.round((stats.totalScore / stats.totalQuestions) * 100) : 0;
    ctx.fillStyle = '#9aa3b2';
    ctx.font = "400 17px 'Tajawal', Arial, sans-serif";
    const statLine = 'أكمل ' + stats.completed + ' من ' + stats.totalLessons + ' درسًا' + (stats.totalQuestions ? ' — بمعدل إجابات صحيحة ' + pct + '%' : '');
    ctx.fillText(statLine, W / 2, 470);

    const dateStr = new Date().toLocaleDateString('ar', { year: 'numeric', month: 'long', day: 'numeric' });
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = "400 14px 'Tajawal', Arial, sans-serif";
    ctx.fillText(dateStr, W / 2, 560);

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '400 12px Arial, sans-serif';
    ctx.fillText('wassim009787.github.io/cyberdz', W / 2, 640);

    const wrap = document.getElementById('cert-preview-wrap');
    wrap.style.display = 'block';
    wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function habitGetState(id){
    let lastDate = null, streak = 0;
    try{
      lastDate = localStorage.getItem('vn_habit_last_' + id);
      streak = parseInt(localStorage.getItem('vn_habit_streak_' + id), 10) || 0;
    }catch(e){}
    return { lastDate: lastDate, streak: streak };
  }

  function habitDaysBetween(d1, d2){
    const ms = Math.abs(new Date(d2) - new Date(d1));
    return Math.floor(ms / (1000 * 60 * 60 * 24));
  }

  function habitIsToday(dateStr){
    if(!dateStr) return false;
    const today = new Date().toISOString().slice(0, 10);
    return dateStr === today;
  }

  function renderHabitList(){
    const host = document.getElementById('habit-list');
    if(!host) return;
    host.innerHTML = HABITS.map(function(h){
      const state = habitGetState(h.id);
      const doneToday = habitIsToday(state.lastDate);

  function habitMarkDone(id){

    let newStreak;
    if(!state.lastDate){

    } else {
      const days = habitDaysBetween(state.lastDate, today);
      newStreak = (days <= 13) ? state.streak + 1 : 1;
    }
    try{
      localStorage.setItem('vn_habit_last_' + id, today);
      localStorage.setItem('vn_habit_streak_' + id, String(newStreak));

      if(u && found.indexOf(u) === -1) found.push(u);
      if(found.length >= 5) break;
    }
    return found;
  }
